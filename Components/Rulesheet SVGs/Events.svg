    <text
       xml:space="preserve"
       id="text9"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect9);display:inline;vector-effect:non-scaling-stroke;fill:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,90.371196)"><tspan
         x="99.986328"
         y="1895.5429"
         id="tspan79"><tspan
   style="font-weight:bold"
   id="tspan78">Shootouts</tspan>
</tspan><tspan
         x="99.986328"
         y="1932.2096"
         id="tspan80">Shootout &quot;power&quot; is gangsters + terror markers.
</tspan><tspan
         x="99.986328"
         y="1968.8762"
         id="tspan82"><tspan
   style="font-style:italic"
   id="tspan81">(&quot;Shootout checks&quot; require rolling eqal or under power.)</tspan>
</tspan><tspan
         x="99.986328"
         y="2005.5428"
         id="tspan83">Remove pieces equal to power, until only 1 remains, in </tspan><tspan
         x="99.986328"
         y="2042.2094"
         id="tspan84">alternating order:
</tspan><tspan
         x="99.986328"
         y="2078.8759"
         id="tspan85">- Civilian (or gangster if no civilians left)
</tspan><tspan
         x="99.986328"
         y="2115.5425"
         id="tspan86">- Active rat (or reveal underground rat if none active)
</tspan><tspan
         x="99.986328"
         y="2152.209"
         id="tspan87">
</tspan><tspan
         x="99.986328"
         y="2188.8755"
         id="tspan88">Any active politicians in the space are flipped underground.</tspan></text>
  </g>
</svg>
