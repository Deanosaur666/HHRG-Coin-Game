    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="254.49414"
         y="61.023438"
         id="tspan11"><tspan
           style="font-weight:bold"
           id="tspan10">EVENTS and TURNS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(-39.597981,-39.743506)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan16"><tspan
   style="font-weight:bold"
   id="tspan14">Event Roll</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan17">At the start of each turn, roll a dice. If a propaganda round is </tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan18">triggered, ignore the event effect, otherwise, the initiative player </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan19">must trigger the following event:
</tspan><tspan
         x="101.01562"
         y="315.76023"
         id="tspan22"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan21">1</tspan>: No effect
</tspan><tspan
         x="101.01562"
         y="362.42685"
         id="tspan24"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan23">2</tspan>: Government player moves an additional armored car
</tspan><tspan
         x="101.01562"
         y="409.09348"
         id="tspan27"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan26">3</tspan>: Government player moves two additional armored cars.
</tspan><tspan
         x="101.01562"
         y="455.7601"
         id="tspan29"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan28">4</tspan>: Initiative player replaces a civilian with a ganster or vice </tspan><tspan
         x="101.01562"
         y="495.3486"
         id="tspan30">versa.
</tspan><tspan
         x="101.01562"
         y="539.09336"
         id="tspan32"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan31">5, 6</tspan>: Initiative player triggers a shootout in a space with terror, </tspan><tspan
         x="101.01562"
         y="578.68185"
         id="tspan34">or, if no terror on the map, may place a terror in a district without </tspan><tspan
         x="101.01562"
         y="615.34848"
         id="tspan35">an active politician.
</tspan><tspan
         x="101.01562"
         y="652.01511"
         id="tspan36">
</tspan><tspan
         x="101.01562"
         y="688.68173"
         id="tspan38"><tspan
   style="font-weight:bold"
   id="tspan37">Armored Car Movement</tspan>
</tspan><tspan
         x="101.01562"
         y="725.34836"
         id="tspan39">The government player may move an armored car (or more if a 2 </tspan><tspan
         x="101.01562"
         y="762.01498"
         id="tspan40">or 3 are rolled) down an un-sabotaged LOC, from checkpoint to </tspan><tspan
         x="101.01562"
         y="798.68161"
         id="tspan41">checkpoint. If an armored car reaches a police station, it is </tspan><tspan
         x="101.01562"
         y="835.34824"
         id="tspan42">removed to available, and the government moves 3 police from </tspan><tspan
         x="101.01562"
         y="872.01486"
         id="tspan43">out of play to available. Whenever an armored car moves, a </tspan><tspan
         x="101.01562"
         y="908.68149"
         id="tspan44">single police cube on its origin space may move with it.
</tspan><tspan
         x="101.01562"
         y="945.34811"
         id="tspan45">
</tspan><tspan
         x="101.01562"
         y="982.01474"
         id="tspan47"><tspan
   style="font-weight:bold"
   id="tspan46">Artillery Phase</tspan>
</tspan><tspan
         x="101.01562"
         y="1018.6814"
         id="tspan48">If the artillery strategic center is sabotaged, remove any artillery </tspan><tspan
         x="101.01562"
         y="1055.348"
         id="tspan49">target markers on the map.
</tspan><tspan
         x="101.01562"
         y="1092.0146"
         id="tspan52">If an artillery marker is in a space and on its red (active) side, the </tspan><tspan
         x="101.01562"
         y="1128.6812"
         id="tspan53">ray artillery fires, as follows:
</tspan><tspan
         x="101.01562"
         y="1165.3479"
         id="tspan54">The government player removes all pieces and markers from the </tspan><tspan
         x="101.01562"
         y="1202.0145"
         id="tspan55">space (civilians and gangsters to government collateral), and sets </tspan><tspan
         x="101.01562"
         y="1238.6811"
         id="tspan56">the space to neutral, then places sabotage and terror in that </tspan><tspan
         x="101.01562"
         y="1275.3477"
         id="tspan57">space.
</tspan><tspan
         x="101.01562"
         y="1312.0144"
         id="tspan58">If the target space is a foreign space, shift the moss down once </tspan><tspan
         x="101.01562"
         y="1348.681"
         id="tspan59">and lose one political will.
</tspan><tspan
         x="101.01562"
         y="1385.3476"
         id="tspan60">If the target space is at support, lose one political will.
</tspan><tspan
         x="101.01562"
         y="1422.0143"
         id="tspan61">Flip any artillery markers on the blue (warning) side to the red </tspan><tspan
         x="101.01562"
         y="1458.6809"
         id="tspan62">(active) side.
</tspan><tspan
         x="101.01562"
         y="1495.3475"
         id="tspan63">
</tspan><tspan
         x="101.01562"
         y="1532.0141"
         id="tspan65"><tspan
   style="font-weight:bold"
   id="tspan64">Drug Trade Phase</tspan>
</tspan><tspan
         x="101.01562"
         y="1568.6808"
         id="tspan67"><tspan
   style="font-style:italic"
   id="tspan66">(If the moss grower is not on the map, Rats profit is zero.)</tspan>
</tspan><tspan
         x="101.01562"
         y="1605.3474"
         id="tspan68">Increase the rats profit marker by the number of civilians and </tspan><tspan
         x="101.01562"
         y="1642.014"
         id="tspan69">gangsters in the moss grower space.
</tspan><tspan
         x="101.01562"
         y="1678.6806"
         id="tspan70">If the profit marker is equal or higher to the target value on the </tspan><tspan
         x="101.01562"
         y="1715.3473"
         id="tspan71">moss track, increase the moss track by one (or lower political will </tspan><tspan
         x="101.01562"
         y="1752.0139"
         id="tspan72">by 1 if the track is already at maximum) and then subtract that </tspan><tspan
         x="101.01562"
         y="1788.6805"
         id="tspan73">value from profits.
</tspan><tspan
         x="101.01562"
         y="1825.3471"
         id="tspan74">
</tspan><tspan
         x="101.01562"
         y="1862.0138"
         id="tspan76"><tspan
   style="font-weight:bold"
   id="tspan75">Player Turns</tspan>
</tspan><tspan
         x="101.01562"
         y="1898.6804"
         id="tspan77">Then, conduct player turns according to the initiative track.</tspan></text>
