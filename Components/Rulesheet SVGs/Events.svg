  <g
     inkscape:label="Layer 1"
     inkscape:groupmode="layer"
     id="layer1">
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="254.49414"
         y="61.023438"
         id="tspan2"><tspan
           style="font-weight:bold"
           id="tspan1">EVENTS and TURNS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(-39.597981,-39.743506)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan4"><tspan
   style="font-weight:bold"
   id="tspan3">Event Roll</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan7">At the start of each turn, roll a dice. If a propaganda round is </tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan8">triggered, ignore the event effect, otherwise, the initiative player </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan9">must trigger the following event:
</tspan><tspan
         x="101.01562"
         y="315.76023"
         id="tspan13"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan11">1</tspan>: No effect
</tspan><tspan
         x="101.01562"
         y="362.42685"
         id="tspan16"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan14">2</tspan>: Government player moves an additional armored car
</tspan><tspan
         x="101.01562"
         y="409.09348"
         id="tspan19"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan17">3</tspan>: Government player moves two additional armored cars.
</tspan><tspan
         x="101.01562"
         y="455.7601"
         id="tspan21"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan20">4</tspan>: Place a civilian (or gangster if terror) in a space with the </tspan><tspan
         x="101.01562"
         y="495.3486"
         id="tspan23">lowest population.
</tspan><tspan
         x="101.01562"
         y="539.09336"
         id="tspan26"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan24">5: </tspan>Initiative player selects a valid space and rolls a shootout </tspan><tspan
         x="101.01562"
         y="585.75998"
         id="tspan28">check. <tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan27">
</tspan></tspan><tspan
         x="101.01562"
         y="632.42661"
         id="tspan30"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan29">6</tspan>: Initiative player selects a valid space with terror and triggers a </tspan><tspan
         x="101.01562"
         y="672.01511"
         id="tspan31">shootout there (no roll). If no terror is on the map, may place a </tspan><tspan
         x="101.01562"
         y="708.68173"
         id="tspan32">terror in any district.
</tspan><tspan
         x="101.01562"
         y="745.34836"
         id="tspan33">
</tspan><tspan
         x="101.01562"
         y="782.01498"
         id="tspan36"><tspan
   style="font-weight:bold"
   id="tspan34">Armored Car Movement</tspan>
</tspan><tspan
         x="101.01562"
         y="818.68161"
         id="tspan37">The government player may move an armored car (or more if a 2 </tspan><tspan
         x="101.01562"
         y="855.34824"
         id="tspan38">or 3 are rolled) down an un-sabotaged LOC, from checkpoint to </tspan><tspan
         x="101.01562"
         y="892.01486"
         id="tspan39">checkpoint. If an armored car reaches a police station, it is </tspan><tspan
         x="101.01562"
         y="928.68149"
         id="tspan40">removed to available, and the government moves 3 police from </tspan><tspan
         x="101.01562"
         y="965.34811"
         id="tspan41">out of play to available. Whenever an armored car moves, a </tspan><tspan
         x="101.01562"
         y="1002.0147"
         id="tspan42">single police cube on its origin space may move with it.
</tspan><tspan
         x="101.01562"
         y="1038.6814"
         id="tspan43">
</tspan><tspan
         x="101.01562"
         y="1075.348"
         id="tspan46"><tspan
   style="font-weight:bold"
   id="tspan44">Artillery Phase</tspan>
</tspan><tspan
         x="101.01562"
         y="1112.0146"
         id="tspan47">If the artillery strategic center is sabotaged, remove any artillery </tspan><tspan
         x="101.01562"
         y="1148.6812"
         id="tspan48">target markers on the map.
</tspan><tspan
         x="101.01562"
         y="1185.3479"
         id="tspan49">If the artillery marker is in a space and on its red (active) side, </tspan><tspan
         x="101.01562"
         y="1222.0145"
         id="tspan50">the ray artillery fires.
</tspan><tspan
         x="101.01562"
         y="1258.6811"
         id="tspan51">If the artillery target marker is in a space and on its orange </tspan><tspan
         x="101.01562"
         y="1295.3477"
         id="tspan52">(warning) side, flip it to the red (active) side.
</tspan><tspan
         x="101.01562"
         y="1332.0144"
         id="tspan53">
</tspan><tspan
         x="101.01562"
         y="1368.681"
         id="tspan56"><tspan
   style="font-weight:bold"
   id="tspan54">Firing</tspan>
</tspan><tspan
         x="101.01562"
         y="1405.3476"
         id="tspan57">The government player removes all pieces and markers from the </tspan><tspan
         x="101.01562"
         y="1442.0143"
         id="tspan58">space (civilians and gangsters to government collateral), and sets </tspan><tspan
         x="101.01562"
         y="1478.6809"
         id="tspan59">the space to neutral, then places sabotage and terror in that </tspan><tspan
         x="101.01562"
         y="1515.3475"
         id="tspan60">space.
</tspan><tspan
         x="101.01562"
         y="1552.0141"
         id="tspan61">If the target space is a foreign space, shift the moss down once </tspan><tspan
         x="101.01562"
         y="1588.6808"
         id="tspan62">and lose 2 political will.
</tspan><tspan
         x="101.01562"
         y="1625.3474"
         id="tspan63">If the target space is at support, lose one political will.
</tspan><tspan
         x="101.01562"
         y="1662.014"
         id="tspan64">Move the artillery marker to out of play.
</tspan><tspan
         x="101.01562"
         y="1698.6806"
         id="tspan65">
</tspan><tspan
         x="101.01562"
         y="1735.3473"
         id="tspan68"><tspan
   style="font-weight:bold"
   id="tspan66">Drug Trade Phase</tspan>
</tspan><tspan
         x="101.01562"
         y="1772.0139"
         id="tspan69">Increase the rats profit marker by the number of civilians and </tspan><tspan
         x="101.01562"
         y="1808.6805"
         id="tspan70">gangsters in the moss grower space.
</tspan><tspan
         x="101.01562"
         y="1845.3471"
         id="tspan71">If the profit marker is equal or higher to the target value on the </tspan><tspan
         x="101.01562"
         y="1882.0138"
         id="tspan72">moss track, increase the moss track by one (or lower political will </tspan><tspan
         x="101.01562"
         y="1918.6804"
         id="tspan73">by 1 if the track is already at maximum) and then subtract that </tspan><tspan
         x="101.01562"
         y="1955.347"
         id="tspan74">value from profits.
</tspan><tspan
         x="101.01562"
         y="1992.0136"
         id="tspan75">
</tspan><tspan
         x="101.01562"
         y="2028.6803"
         id="tspan78"><tspan
   style="font-weight:bold"
   id="tspan76">Player Turns</tspan>
</tspan><tspan
         x="101.01562"
         y="2065.3469"
         id="tspan79">Then, conduct player turns according to the initiative track.</tspan></text>
