       x="-440.01428"
       y="0"
       transform="translate(0,872.0042)"><tspan
         x="99.986328"
         y="505.9531"
         id="tspan110"><tspan
   style="font-weight:bold"
   id="tspan109">Hide</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan112"><tspan
   style="font-weight:bold"
   id="tspan111">Location</tspan>: Any districts, up to the arms cache value on the </tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan113">moss track.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan115"><tspan
   style="font-weight:bold"
   id="tspan114">Procedure</tspan>: In each space, flip one active rat underground.</tspan></text>
