       y="0"
       transform="translate(20.013674,398.04686)"><tspan
         x="99.986328"
         y="1731.9531"
         id="tspan7"><tspan
   style="font-weight:bold"
   id="tspan2">Assassination</tspan>
</tspan><tspan
         x="99.986328"
         y="1768.6197"
         id="tspan8">When a politician is removed by a Rat attack, reduce </tspan><tspan
         x="99.986328"
         y="1805.2863"
         id="tspan9">political will by 2, an emergency zone is placed in the </tspan><tspan
         x="99.986328"
         y="1841.953"
         id="tspan10">space (if none available, government chooses which space </tspan><tspan
         x="99.986328"
         y="1878.6196"
         id="tspan11">to pull from). Politicians are removed to out of play.</tspan></text>
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="173.27148"
         y="61.023438"
         id="tspan13"><tspan
           style="font-weight:bold"
           id="tspan12">RATS SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(-40.872395,-7.4714437)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan15"><tspan
   style="font-weight:bold"
   id="tspan14">Traffic</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan17"><tspan
   style="font-weight:bold"
   id="tspan16">Purpose:</tspan> Place moss grower or move moss grower.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan63"><tspan
   style="font-weight:bold"
   id="tspan62">Location:</tspan> A district with an underground rat.
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan65"><tspan
           style="font-weight:bold"
           id="tspan64">Procedure:
</tspan></tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan66">If the moss grower is on the map, move the moss grower to an </tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan67">adjacent district.
</tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan68">Otherwise, place the moss grower in a district with an </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan69">underground rat and no support.</tspan></text>
