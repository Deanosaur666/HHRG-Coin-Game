   style="font-weight:bold"
   id="tspan86">Purpose:</tspan> Hide rats
</tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan89"><tspan
   style="font-weight:bold"
   id="tspan88">Location:</tspan> Any districts without emergency zones, up to </tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan90">the special value on the moss track.
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan92"><tspan
   style="font-weight:bold"
   id="tspan91">Procedure:</tspan> In each space, flip one active rat underground.</tspan></text>
