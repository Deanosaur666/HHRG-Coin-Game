           id="tspan82">OTHER ACTIONS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text10"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect10);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,64.426409)"><tspan
         x="99.986328"
         y="505.9531"
         id="tspan85"><tspan
   style="font-weight:bold"
   id="tspan84">Raid</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan87"><tspan
   style="font-weight:bold"
   id="tspan86">Purpose</tspan>: Move cells and flip them underground.
</tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan89"><tspan
   style="font-weight:bold"
   id="tspan88">Location</tspan>: Spaces adjacent to an arms cache, up to the </tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan90">arms cache value on the moss track.
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan92"><tspan
   style="font-weight:bold"
   id="tspan91">Procedure</tspan>: Pick either:
</tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan93">* Move 1 or 2 cells from an adjacent space with an arms </tspan><tspan
         x="99.986328"
         y="725.95285"
         id="tspan94">cache to the selected space, and then may perform a </tspan><tspan
         x="99.986328"
         y="762.61948"
         id="tspan95">single sabotage in the destination space.
</tspan><tspan
         x="99.986328"
         y="799.2861"
         id="tspan96">* Move 1 or 2 cells from the selected space to an adjacent </tspan><tspan
         x="99.986328"
         y="835.95273"
         id="tspan97">space with an arms cache, and flip them underground.</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#f8dfde;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
