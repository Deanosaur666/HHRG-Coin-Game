    <text
       xml:space="preserve"
       id="text3"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect3);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,160.5412)"><tspan
         x="99.986328"
         y="1731.9531"
         id="tspan25"><tspan
   style="font-weight:bold"
   id="tspan23">Assassination</tspan>
</tspan><tspan
         x="99.986328"
         y="1768.6197"
         id="tspan26">When a politician is removed by a Rat attack, decrease </tspan><tspan
         x="99.986328"
         y="1805.2863"
         id="tspan28">political will by 2 and an emergency zone is placed in the </tspan><tspan
         x="99.986328"
         y="1841.953"
         id="tspan29">space (remaining politicians are flipped underground). Set </tspan><tspan
         x="99.986328"
         y="1878.6196"
         id="tspan31">the space to neutral. Politicians are removed to out of play.</tspan></text>
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="173.27148"
         y="61.023438"
         id="tspan67"><tspan
           style="font-weight:bold"
           id="tspan64">RATS SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan69"><tspan
   style="font-weight:bold"
   id="tspan68">Traffic</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan71"><tspan
   style="font-weight:bold"
   id="tspan70">Purpose</tspan>: Increase moss track and move an arms cache.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan73"><tspan
   style="font-weight:bold"
   id="tspan72">Location</tspan>: Moss grower space, or a district with an </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan74">underground rat.
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan76"><tspan
   style="font-weight:bold"
   id="tspan75">Procedure</tspan>: If the moss grower is on the map, place a </tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan77">gangster in its space. Otherwise, place the moss grower in </tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan79">a district with an underground rat <tspan
   style="font-style:italic"
   id="tspan78">and no support</tspan>.
</tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan80">Then, may move one arms cache from any space to an </tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan81">adjacent district.</tspan></text>
