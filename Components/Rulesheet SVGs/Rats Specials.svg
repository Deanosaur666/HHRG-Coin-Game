       y="0"
       transform="translate(-39.986327,297.94569)"><tspan
         x="99.986328"
         y="505.9531"
         id="tspan71"><tspan
   style="font-weight:bold"
   id="tspan70">Raid</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan73"><tspan
   style="font-weight:bold"
   id="tspan72">Purpose:</tspan> Move cells and flip them underground.
</tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan75"><tspan
   style="font-weight:bold"
   id="tspan74">Location:</tspan> Spaces adjacent to an arms cache, up to the special </tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan76">value on the moss track.
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan78"><tspan
   style="font-weight:bold"
   id="tspan77">Procedure:</tspan> Pick either:
</tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan79">* Move 1 or 2 cells from an adjacent space with an arms cache </tspan><tspan
         x="99.986328"
         y="725.95285"
         id="tspan80">to the selected space, and then may perform a single sabotage </tspan><tspan
         x="99.986328"
         y="762.61948"
         id="tspan81">in the destination space.
</tspan><tspan
         x="99.986328"
         y="799.2861"
         id="tspan82">* Move 1 or 2 cells from the selected space to an adjacent arms </tspan><tspan
         x="99.986328"
         y="835.95273"
         id="tspan83">cache, and then flip them underground.</tspan></text>
