    <text
       xml:space="preserve"
       id="text24"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect27);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,501.48024)"><tspan
         x="99.986328"
         y="505.9531"
         id="tspan99"><tspan
   style="font-weight:bold"
   id="tspan98">Smuggle</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan101"><tspan
   style="font-weight:bold"
   id="tspan100">Location</tspan>: A district adjacent to the moss grower, without </tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan102">support or an emergency zone.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan104"><tspan
   style="font-weight:bold"
   id="tspan103">Procedure</tspan>: Either:
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan105">* Place an arms cache and a gangster in the selected </tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan106">space.
</tspan><tspan
         x="99.986328"
         y="725.95285"
         id="tspan107">* Move the moss grower to the selected space. May also </tspan><tspan
         x="99.986328"
         y="762.61948"
         id="tspan108">move a rat cell from the grower's original space.</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#f8dfde;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
