    <text
       xml:space="preserve"
       id="text11"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect11);display:inline;vector-effect:non-scaling-stroke;fill:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,35.330956)"><tspan
         x="99.986328"
         y="436.07419"
         id="tspan40"><tspan
   style="font-weight:bold"
   id="tspan39">Campaign</tspan>
</tspan><tspan
         x="99.986328"
         y="472.74081"
         id="tspan42"><tspan
   style="font-weight:bold"
   id="tspan41">Location</tspan>: Any district with an active politician.
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan44"><tspan
   style="font-weight:bold"
   id="tspan43">Procedure</tspan>: Flip an active politician in the district </tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan45">underground. Then, may either.
</tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan46">* Add one civilian cube to the space
</tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan47">* Place an emergency zone
</tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan48">Then, may move one rat cell in the selected space to an </tspan><tspan
         x="99.986328"
         y="692.74057"
         id="tspan60">adjacent space.</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#aaeded;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
