   id="tspan45">Transport</tspan>
</tspan><tspan
         x="99.986328"
         y="472.74081"
         id="tspan48"><tspan
   style="font-weight:bold"
   id="tspan47">Purpose:</tspan> Move police
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan50"><tspan
   style="font-weight:bold"
   id="tspan49">Location:</tspan> Any non-foreign destination spaces.
</tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan52"><tspan
   style="font-weight:bold"
   id="tspan51">Procedure:</tspan> Move police from any spaces along a chain of </tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan53">un-sabotaged LOCs and strategic centers, then finally into </tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan54">adjacent destination spaces.</tspan></text>
