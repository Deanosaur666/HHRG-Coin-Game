       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan5"><tspan
   style="font-weight:bold"
   id="tspan4">Supply (Econ action)</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan23"><tspan
   style="font-weight:bold"
   id="tspan7">Accompanying Ops:</tspan> Mobilize, sweep or Assault
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan25"><tspan
   style="font-weight:bold"
   id="tspan24">Purpose:</tspan> Place armored cars to increase police supply.
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan27"><tspan
   style="font-weight:bold"
   id="tspan26">Location</tspan>: An un-sabotaged factory, or the out of play </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan28">box.
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan30"><tspan
   style="font-weight:bold"
   id="tspan29">Procedure</tspan>: Either:
</tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan32"><tspan
   style="font-weight:bold"
   id="tspan31">A</tspan>: Place an armored car at the selected factory, and then </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan33">may place an available police there.
</tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan35"><tspan
   style="font-weight:bold"
   id="tspan34">B</tspan>: Return 1 politician from out of play to available.</tspan></text>
