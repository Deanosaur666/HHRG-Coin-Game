   id="tspan1">ECON</tspan>
</tspan><tspan
         x="99.986328"
         y="1494.6197"
         id="tspan10"><tspan
   style="font-weight:bold"
   id="tspan5">Procedure</tspan>: Perform the <tspan
   style="font-style:italic"
   id="tspan7">supply</tspan> special activity.</tspan></text>
    <text
       xml:space="preserve"
       id="text33"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect33);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,173.42851)"><tspan
         x="99.986328"
         y="1651.9531"
         id="tspan17"><tspan
   style="font-weight:bold"
   id="tspan16">Armored Car Movement</tspan>
</tspan><tspan
         x="99.986328"
         y="1688.6197"
         id="tspan50"><tspan
   style="font-weight:bold"
   id="tspan49">Procedure</tspan>: At the start of each event phase, the </tspan><tspan
         x="99.986328"
         y="1725.2863"
         id="tspan51">government may move a number of armored cars based on </tspan><tspan
         x="99.986328"
         y="1761.953"
         id="tspan52">the event roll. 
</tspan><tspan
         x="99.986328"
         y="1798.6196"
         id="tspan53">Armored cars on sabotaged LOCs cannot move. Each </tspan><tspan
         x="99.986328"
         y="1835.2862"
         id="tspan54">selected car moves towards a police station along its LOC, </tspan><tspan
         x="99.986328"
         y="1871.9529"
         id="tspan55">to the next checkpoint.
</tspan><tspan
         x="99.986328"
         y="1908.6195"
         id="tspan56">
</tspan><tspan
         x="99.986328"
         y="1945.2861"
         id="tspan57">Whenever an armored car moves, a single police cube on </tspan><tspan
         x="99.986328"
         y="1981.9527"
         id="tspan58">its origin space may move with it.</tspan></text>
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="52.392578"
         y="61.023438"
         id="tspan72"><tspan
           style="font-weight:bold"
           id="tspan59">GOVERNMENT SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan76"><tspan
   style="font-weight:bold"
   id="tspan74">Supply</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan78"><tspan
   style="font-weight:bold"
   id="tspan77">Location</tspan>: An un-sabotaged factory, or the out of play box.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan80"><tspan
   style="font-weight:bold"
   id="tspan79">Procedure</tspan>: Either:
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan81">* Place an armored car at the selected factory, and then </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan82">may place an available police there.
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan83">* Return 1 politician from out of play to available.</tspan></text>
