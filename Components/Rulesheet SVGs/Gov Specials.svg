   style="font-weight:bold"
   id="tspan38">Accompanying Ops:</tspan> Any
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan41"><tspan
   style="font-weight:bold"
   id="tspan40">Purpose:</tspan> Add civilian cubes or emergency zones and move </tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan42">rats.
</tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan44"><tspan
   style="font-weight:bold"
   id="tspan43">Location:</tspan> Any district with an active politician
</tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan46"><tspan
   style="font-weight:bold"
   id="tspan45">Procedure:</tspan> Flip an active politician in the district </tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan47">underground. Then, may either.
</tspan><tspan
         x="99.986328"
         y="692.74057"
         id="tspan48">* Add one civilian cube to the space
</tspan><tspan
         x="99.986328"
         y="729.4072"
         id="tspan49">* Place an emergency zone
</tspan><tspan
         x="99.986328"
         y="766.07382"
         id="tspan50">Then, may move one rat cell in the selected space to an </tspan><tspan
         x="99.986328"
         y="802.74045"
         id="tspan51">adjacent space.
</tspan><tspan
         x="99.986328"
         y="839.40707"
         id="tspan52">
</tspan></text>
