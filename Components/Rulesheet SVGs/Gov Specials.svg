         y="1058.0351"
         id="tspan56"><tspan
   style="font-weight:bold"
   id="tspan55">Artillery</tspan>
</tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan58"><tspan
           style="font-style:italic"
           id="tspan57">Only available if artillery strategic center is not </tspan></tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan60"><tspan
   style="font-style:italic"
   id="tspan59">sabotaged.</tspan>
</tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan62"><tspan
   style="font-weight:bold"
   id="tspan61">Purpose:</tspan> Remove all pieces from a space.
</tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan64"><tspan
   style="font-weight:bold"
   id="tspan63">Location:</tspan> Any one district or foreign space.
</tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan66"><tspan
   style="font-weight:bold"
   id="tspan65">Procedure:</tspan>
</tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan67">If the artillery marker is available, place an artillery </tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan68">target marker in the selected space, on its orange </tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan69">(warning) side. Otherwise, move the artillery marker to </tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan70">available.</tspan></text>
