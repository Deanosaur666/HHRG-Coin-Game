       y="0"
       transform="translate(-15.592233,109.53614)"><tspan
         x="99.986328"
         y="436.07419"
         id="tspan29"><tspan
   style="font-weight:bold"
   id="tspan28">Campaign</tspan>
</tspan><tspan
         x="99.986328"
         y="472.74081"
         id="tspan31"><tspan
   style="font-weight:bold"
   id="tspan30">Purpose:</tspan> Add civilian cubes or emergency zones and move </tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan32">rats.
</tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan34"><tspan
   style="font-weight:bold"
   id="tspan33">Location:</tspan> Any districts with an active politician
</tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan36"><tspan
   style="font-weight:bold"
   id="tspan35">Procedure:</tspan> Flip an active politician in the district </tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan37">underground.
</tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan39"><tspan
   style="font-style:italic"
   id="tspan38">If at support</tspan>, remove any support in the space, then either </tspan><tspan
         x="99.986328"
         y="692.74057"
         id="tspan40">remove an emergency zone, or if no emergency zone, add </tspan><tspan
         x="99.986328"
         y="729.4072"
         id="tspan41">one civilian cube (up to population limit).
</tspan><tspan
         x="99.986328"
         y="766.07382"
         id="tspan42">Then, may move one rat cell in the selected space to an </tspan><tspan
         x="99.986328"
         y="802.74045"
         id="tspan43">adjacent space.
</tspan><tspan
         x="99.986328"
         y="839.40707"
         id="tspan44">
</tspan></text>
