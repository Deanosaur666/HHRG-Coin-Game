         y="472.74081"
         id="tspan87"><tspan
   style="font-weight:bold"
   id="tspan86">Accompanying Ops:</tspan> Sweep, Assault
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan89"><tspan
   style="font-weight:bold"
   id="tspan88">Purpose:</tspan> Add civilian cubes or emergency zones and move </tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan90">rats.
</tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan92"><tspan
   style="font-weight:bold"
   id="tspan91">Location:</tspan> Any district with an active politician
</tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan94"><tspan
   style="font-weight:bold"
   id="tspan93">Procedure:</tspan> Flip an active politician in the district </tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan95">underground. Then, may either.
</tspan><tspan
         x="99.986328"
         y="692.74057"
         id="tspan96">* Add one civilian cube to the space
</tspan><tspan
         x="99.986328"
         y="729.4072"
         id="tspan97">* Place an emergency zone
</tspan><tspan
         x="99.986328"
         y="766.07382"
         id="tspan98">Then, may move one rat cell in the selected space to an </tspan><tspan
         x="99.986328"
         y="802.74045"
         id="tspan99">adjacent space.
</tspan><tspan
         x="99.986328"
         y="839.40707"
         id="tspan100">
</tspan></text>
