       x="38.999989"
       y="1046"
       rx="81.872604"
       ry="72.249725" />
    <text
       xml:space="preserve"
       id="text7"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect7);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-23.576653,45.325753)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan70"><tspan
   style="font-weight:bold"
   id="tspan69">Artillery</tspan>
</tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan72"><tspan
   style="font-style:italic"
   id="tspan71">Only available if artillery strategic center is not sabotaged.</tspan>
</tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan74"><tspan
   style="font-weight:bold"
   id="tspan73">Location</tspan>: Any one district or foreign space
</tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan76"><tspan
   style="font-weight:bold"
   id="tspan75">Procedure</tspan>: As a cost, remove 4 police from police stations </tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan77">and/or available to out of play. Then remove all pieces (*3) </tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan79">from the space (police and politicians to <tspan
   style="font-style:italic"
   id="tspan78">available</tspan>), and set the </tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan80">space to neutral, with a terror and sabotage.
</tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan81">If the target space is a foreign space, shift the moss down once </tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan82">and lose one political will.
</tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan83">If the target space is at support, lose one political will.</tspan></text>
  </g>
</svg>
