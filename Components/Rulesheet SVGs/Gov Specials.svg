         id="tspan5"><tspan
           style="font-weight:bold"
           id="tspan4">GOVERNMENT SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan7"><tspan
   style="font-weight:bold"
   id="tspan6">Supply</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan11"><tspan
   style="font-weight:bold"
   id="tspan10">Purpose:</tspan> Place armored cars to increase police supply.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan16"><tspan
   style="font-weight:bold"
   id="tspan15">Location</tspan>: Any un-sabotaged factories, or the out of play </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan18">box.
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan21"><tspan
   style="font-weight:bold"
   id="tspan20">Procedure</tspan>: Either:
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan24"><tspan
   style="font-weight:bold"
   id="tspan23">A</tspan>: Place an armored car at each selected factory, and </tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan25">then may place an available police there.
</tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan27"><tspan
   style="font-weight:bold"
   id="tspan26">B</tspan>: Return 2 politicians from out of play to available.</tspan></text>
