         id="tspan122"><tspan
   style="font-weight:bold"
   id="tspan121">Purpose:</tspan> Remove all pieces from a space.
</tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan124"><tspan
   style="font-weight:bold"
   id="tspan123">Location:</tspan> Any one district or foreign space.
</tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan126"><tspan
   style="font-weight:bold"
   id="tspan125">Procedure:</tspan>
</tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan127">If the artillery marker is available, place an artillery </tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan128">target marker in the selected space, on its orange </tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan129">(warning) side. Otherwise, move the artillery marker to </tspan><tspan
         x="99.986328"
         y="1424.7014"
         id="tspan130">available.</tspan></text>
