         y="1278.0349"
         id="tspan78"><tspan
   style="font-weight:bold"
   id="tspan77">Procedure:</tspan>
</tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan79">If the artillery marker is available, place an artillery </tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan80">target marker in the selected space, on its orange </tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan81">(warning) side. Otherwise, move the artillery marker to </tspan><tspan
         x="99.986328"
         y="1424.7014"
         id="tspan82">available.</tspan></text>
