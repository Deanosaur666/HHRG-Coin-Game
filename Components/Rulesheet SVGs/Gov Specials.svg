         x="52.392578"
         y="61.023438"
         id="tspan6"><tspan
           style="font-weight:bold"
           id="tspan2">GOVERNMENT SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan9"><tspan
   style="font-weight:bold"
   id="tspan8">Supply (Econ action)</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan11"><tspan
   style="font-weight:bold"
   id="tspan10">Accompanying Ops:</tspan> Mobilize, sweep or Assault
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan13"><tspan
   style="font-weight:bold"
   id="tspan12">Purpose:</tspan> Place armored cars to increase police supply.
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan15"><tspan
   style="font-weight:bold"
   id="tspan14">Location</tspan>: An un-sabotaged factory, or the out of play </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan16">box.
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan18"><tspan
   style="font-weight:bold"
   id="tspan17">Procedure</tspan>: Either:
</tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan20"><tspan
   style="font-weight:bold"
   id="tspan19">A</tspan>: Place an armored car at the selected factory, and then </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan21">may place an available police there.
</tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan83"><tspan
   style="font-weight:bold"
   id="tspan22">B</tspan>: Return 1 politician from out of play to available.</tspan></text>
