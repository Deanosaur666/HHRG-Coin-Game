       transform="translate(0,35.330956)"><tspan
         x="99.986328"
         y="436.07419"
         id="tspan87"><tspan
   style="font-weight:bold"
   id="tspan86">Campaign</tspan>
</tspan><tspan
         x="99.986328"
         y="472.74081"
         id="tspan89"><tspan
   style="font-weight:bold"
   id="tspan88">Location</tspan>: Any district with an active politician.
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan91"><tspan
   style="font-weight:bold"
   id="tspan90">Procedure</tspan>: Flip an active politician in the district </tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan92">underground. Then, may either.
</tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan93">* Add one civilian cube to the space
</tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan94">* Place an emergency zone
</tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan95">Then, may move one rat cell in the selected space to an </tspan><tspan
         x="99.986328"
         y="692.74057"
         id="tspan96">adjacent space.</tspan></text>
    <rect
