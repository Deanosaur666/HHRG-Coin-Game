       transform="translate(0,208.78385)"><tspan
         x="99.986328"
         y="1457.9531"
         id="tspan4"><tspan
   style="font-weight:bold"
   id="tspan2">ECON</tspan>
</tspan><tspan
         x="99.986328"
         y="1494.6197"
         id="tspan9"><tspan
   style="font-weight:bold"
   id="tspan6">Procedure</tspan>: Perform the <tspan
   style="font-style:italic"
   id="tspan8">supply</tspan> special activity.</tspan></text>
    <text
       xml:space="preserve"
       id="text33"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect33);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,173.42851)"><tspan
         x="99.986328"
         y="1651.9531"
         id="tspan12"><tspan
   style="font-weight:bold"
   id="tspan11">Armored Car Movement</tspan>
</tspan><tspan
         x="99.986328"
         y="1688.6197"
         id="tspan14"><tspan
   style="font-weight:bold"
   id="tspan13">Procedure</tspan>: At the start of each event phase, the </tspan><tspan
         x="99.986328"
         y="1725.2863"
         id="tspan15">government may move a number of armored cars based on </tspan><tspan
         x="99.986328"
         y="1761.953"
         id="tspan18">the event roll. 
</tspan><tspan
         x="99.986328"
         y="1798.6196"
         id="tspan19">Armored cars on sabotaged LOCs cannot move. Each </tspan><tspan
         x="99.986328"
         y="1835.2862"
         id="tspan20">selected car moves towards a police station along its LOC, </tspan><tspan
         x="99.986328"
         y="1871.9529"
         id="tspan21">to the next checkpoint.
</tspan><tspan
         x="99.986328"
         y="1908.6195"
         id="tspan22">
</tspan><tspan
         x="99.986328"
         y="1945.2861"
         id="tspan23">Whenever an armored car moves, a single police cube on </tspan><tspan
         x="99.986328"
         y="2009.9531"
         id="tspan25"><tspan
           dx="0 8.1497307 11.501289 15.282536 9.3242073 17.946594 12.059879 8.1497345 18.619766 8.1497345 18.591125 9.3242035 15.282532 18.619766 17.97525 16.127579 18.04686 9.3242035 28.574203 17.97522 17.359375 9.3241882 28.574188 17.946594 17.359375 18.046844 9.3242188 23.990845 8.1497192 11.501312 18.591125 9.3241882 8.1497498 11.501282"
           id="tspan24">its origin space may move with it.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="52.392578"
         y="61.023438"
         id="tspan27"><tspan
           style="font-weight:bold"
           id="tspan26">GOVERNMENT SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan29"><tspan
   style="font-weight:bold"
   id="tspan28">Supply</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan31"><tspan
   style="font-weight:bold"
   id="tspan30">Location</tspan>: An un-sabotaged factory, or the out of play box.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan33"><tspan
   style="font-weight:bold"
   id="tspan32">Procedure</tspan>: Either:
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan34">* Place an armored car at the selected factory, and then </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan35">may place an available police there.
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan36">* Return 1 politician from out of play to available.</tspan></text>
