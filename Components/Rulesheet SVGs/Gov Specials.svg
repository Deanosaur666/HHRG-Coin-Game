         y="509.40744"
         id="tspan106"><tspan
   style="font-weight:bold"
   id="tspan105">Purpose:</tspan> Move police
</tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan108"><tspan
   style="font-weight:bold"
   id="tspan107">Location:</tspan> Any non-foreign destination spaces.
</tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan110"><tspan
   style="font-weight:bold"
   id="tspan109">Procedure:</tspan> Move police from any spaces along a chain of </tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan111">un-sabotaged LOCs and strategic centers, then finally into </tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan112">adjacent destination spaces.</tspan></text>
