       width="929.5918"
       height="230.5481"
       x="75.204071"
       y="783.59766"
       rx="79.847824"
       ry="72.525284" />
    <text
       xml:space="preserve"
       id="text18"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect18);display:inline;vector-effect:non-scaling-stroke;fill:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(4.0000001,405.33096)"><tspan
         x="99.986328"
         y="436.07419"
         id="tspan62"><tspan
   style="font-weight:bold"
   id="tspan61">Transport</tspan>
</tspan><tspan
         x="99.986328"
         y="472.74081"
         id="tspan64"><tspan
   style="font-weight:bold"
   id="tspan63">Location</tspan>: Any non-foreign destination spaces.
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan66"><tspan
   style="font-weight:bold"
   id="tspan65">Procedure:</tspan> Move police from any spaces along a chain of </tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan67">un-sabotaged LOCs and strategic centers, then finally into </tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan68">adjacent destination spaces.</tspan></text>
    <rect
       style="vector-effect:non-scaling-stroke;fill:#aaeded;fill-opacity:1;stroke:#000000;stroke-width:0.999991;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
