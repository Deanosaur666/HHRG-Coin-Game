         y="546.07407"
         id="tspan60"><tspan
   style="font-weight:bold"
   id="tspan59">Location:</tspan> Any non-foreign destination spaces.
</tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan62"><tspan
   style="font-weight:bold"
   id="tspan61">Procedure:</tspan> Move police from any spaces along a chain of </tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan63">un-sabotaged LOCs and strategic centers, then finally into </tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan64">adjacent destination spaces.</tspan></text>
