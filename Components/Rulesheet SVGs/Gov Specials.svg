       transform="translate(4.0000001,405.33096)"><tspan
         x="99.986328"
         y="436.07419"
         id="tspan98"><tspan
   style="font-weight:bold"
   id="tspan97">Transport</tspan>
</tspan><tspan
         x="99.986328"
         y="472.74081"
         id="tspan100"><tspan
   style="font-weight:bold"
   id="tspan99">Location</tspan>: Any non-foreign destination spaces.
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan102"><tspan
   style="font-weight:bold"
   id="tspan101">Procedure:</tspan> Move police from any spaces along a chain of </tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan103">un-sabotaged LOCs and strategic centers, then finally into </tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan104">adjacent destination spaces.</tspan></text>
