   style="font-weight:bold"
   id="tspan105">Artillery</tspan>
</tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan108"><tspan
           style="font-style:italic"
           id="tspan107">Only available if artillery strategic center is not </tspan></tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan110"><tspan
   style="font-style:italic"
   id="tspan109">sabotaged.</tspan>
</tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan112"><tspan
   style="font-weight:bold"
   id="tspan111">Location</tspan>: Any one district or foreign space
</tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan114"><tspan
   style="font-weight:bold"
   id="tspan113">Procedure</tspan>: As a cost, remove 2 police from police </tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan115">stations and/or available to out of play. Then place an </tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan116">artillery target marker in the selected space, on its blue </tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan117">(warning) side.</tspan></text>
