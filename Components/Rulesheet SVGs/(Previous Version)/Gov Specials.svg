</tspan><tspan
         x="99.986328"
         y="701.84433"
         id="tspan64"><tspan
   style="font-style:italic"
   id="tspan63">Only available if artillery strategic center is not sabotaged.</tspan>
</tspan><tspan
         x="99.986328"
         y="738.51096"
         id="tspan66"><tspan
   style="font-weight:bold"
   id="tspan65">Purpose</tspan>: Remove all pieces from a space.
</tspan><tspan
         x="99.986328"
         y="775.17758"
         id="tspan68"><tspan
   style="font-weight:bold"
   id="tspan67">Location</tspan>: Any district or foreign space.
</tspan><tspan
         x="99.986328"
         y="811.84421"
         id="tspan70"><tspan
   style="font-weight:bold"
   id="tspan69">Procedure</tspan>: As a cost, remove 4 police from the map and </tspan><tspan
         x="99.986328"
         y="848.51083"
         id="tspan71">available to out of play. Then remove all pieces, except </tspan><tspan
         x="99.986328"
         y="885.17746"
         id="tspan72">sabotage, from the space (police to out of play).
</tspan><tspan
         x="99.986328"
         y="921.84409"
         id="tspan74"><tspan
   style="font-style:italic"
   id="tspan73">If the target space is a foreign space</tspan>, shift the moss track </tspan><tspan
         x="99.986328"
         y="958.51071"
         id="tspan75">once to the left, shift the support track once to the left, and </tspan><tspan
         x="99.986328"
         y="995.17734"
         id="tspan76">lose one political will.</tspan></text>
