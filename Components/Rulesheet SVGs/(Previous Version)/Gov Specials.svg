           x="99.986328"
           y="1651.9531"
           id="tspan31"><tspan
   style="font-weight:bold"
   id="tspan30">Armored Car Movement</tspan>
</tspan><tspan
           x="99.986328"
           y="1688.6197"
           id="tspan33"><tspan
   style="font-weight:bold"
   id="tspan32">Procedure</tspan>: At the start of each event phase, the </tspan><tspan
           x="99.986328"
           y="1725.2863"
           id="tspan37">government may move a number of armored cars based on </tspan><tspan
           x="99.986328"
           y="1761.953"
           id="tspan38">the event roll.
</tspan><tspan
           x="99.986328"
           y="1798.6196"
           id="tspan39">Armored cars on sabotaged LOCs cannot move. Each </tspan><tspan
           x="99.986328"
           y="1835.2862"
           id="tspan41">selected car moves towards a police station along its LOC.
</tspan></text>
