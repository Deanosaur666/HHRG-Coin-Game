    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="265.12305"
         y="61.023438"
         id="tspan29"><tspan
           style="font-weight:bold"
           id="tspan28">GOVERNMENT OPS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(-20.485282,-27.698486)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan31"><tspan
   style="font-weight:bold"
   id="tspan30">Mobilize</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan33"><tspan
   style="font-weight:bold"
   id="tspan32">Special Activities:</tspan> Supply, Transport, or artillery.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan35"><tspan
   style="font-weight:bold"
   id="tspan34">Purpose:</tspan> Place police.
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan37"><tspan
   style="font-weight:bold"
   id="tspan36">Location:</tspan> 3 spaces, either districts, LOCs, or Strategic </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan38">centers.
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan40"><tspan
   style="font-weight:bold"
   id="tspan39">Procedure:</tspan>
</tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan41">In each space, pick 1:
</tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan44"><tspan
   style="font-weight:bold"
   id="tspan42">A</tspan>: <tspan
   style="font-style:italic"
   id="tspan43">If police station</tspan>, place up to 3 police if un-sabotaged, or 1 </tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan45">if sabotaged.
</tspan><tspan
         x="101.01562"
         y="492.01523"
         id="tspan48"><tspan
   style="font-weight:bold"
   id="tspan46">B</tspan>:  <tspan
   style="font-style:italic"
   id="tspan47">If LOCs with at least 2 police, or Strategic Centers with at </tspan></tspan><tspan
         x="101.01562"
         y="528.68185"
         id="tspan50"><tspan
   style="font-style:italic"
   id="tspan49">least 3 police</tspan>, remove a sabotage
</tspan><tspan
         x="101.01562"
         y="565.34848"
         id="tspan53"><tspan
   style="font-weight:bold"
   id="tspan51">C</tspan>: <tspan
   style="font-style:italic"
   id="tspan52">If district with police</tspan>, place an active politician or move an </tspan><tspan
         x="101.01562"
         y="602.01511"
         id="tspan54">active politician to the space. Then, for each politician in that </tspan><tspan
         x="101.01562"
         y="638.68173"
         id="tspan55">space, may remove a terror or sabotage from the space, or, </tspan><tspan
         x="101.01562"
         y="675.34836"
         id="tspan57"><tspan
   style="font-style:italic"
   id="tspan56">if no terror or sabotage</tspan>, may shift the space towards support.
</tspan><tspan
         x="101.01562"
         y="712.01498"
         id="tspan60"><tspan
   style="font-weight:bold"
   id="tspan58">D</tspan>: <tspan
   style="font-style:italic"
   id="tspan59">If a district with underground politicians</tspan>, flip all </tspan><tspan
         x="101.01562"
         y="748.68161"
         id="tspan61">underground politicians there to active.
</tspan></text>
