    <text
       xml:space="preserve"
       id="text25"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect26);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-13.664173,397.2112)"><tspan
         x="99.986328"
         y="467.12692"
         id="tspan63"><tspan
           style="font-weight:bold"
           id="tspan62">Sweep
</tspan></tspan><tspan
         x="99.986328"
         y="503.79355"
         id="tspan65"><tspan
   style="font-weight:bold"
   id="tspan64">Special Activities</tspan>: Any
</tspan><tspan
         x="99.986328"
         y="540.46018"
         id="tspan67"><tspan
   style="font-weight:bold"
   id="tspan66">Purpose</tspan>: Move police and reveal Rat cells.
</tspan><tspan
         x="99.986328"
         y="577.1268"
         id="tspan69"><tspan
   style="font-weight:bold"
   id="tspan68">Location</tspan>: Any 3 destination spaces (not foreign spaces).
</tspan><tspan
         x="99.986328"
         y="613.79343"
         id="tspan71"><tspan
   style="font-weight:bold"
   id="tspan70">Procedure</tspan>: Move police from adjacent spaces, then:
</tspan><tspan
         x="99.986328"
         y="650.46005"
         id="tspan72">* If the space is at opposition, reveal one cell for every two </tspan><tspan
         x="99.986328"
         y="687.12668"
         id="tspan73">police there.
</tspan><tspan
         x="99.986328"
         y="723.79331"
         id="tspan74">* Otherwise, reveal one cell for every police there.
</tspan><tspan
         x="99.986328"
         y="760.45993"
         id="tspan75">* When sweeping into emergency zones, may assault there </tspan><tspan
         x="99.986328"
         y="797.12656"
         id="tspan76">instead of revealing.
</tspan><tspan
         x="99.986328"
         y="833.79318"
         id="tspan77">Then, if destination space is a district with sabotage or terror, </tspan><tspan
         x="99.986328"
         y="870.45981"
         id="tspan78">place an emergency zone.
</tspan><tspan
         x="99.986328"
         y="907.12644"
         id="tspan80"><tspan
           style="font-style:italic"
           id="tspan79">Note: Movement is considered to be simultaneous.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text29"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect29);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-22.485282,373.34598)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan82"><tspan
   style="font-weight:bold"
   id="tspan81">Assault</tspan>
</tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan84"><tspan
   style="font-weight:bold"
   id="tspan83">Special Activities:</tspan> Any
</tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan86"><tspan
   style="font-weight:bold"
   id="tspan85">Purpose:</tspan> Remove Rat cells, arm caches, moss growers, and </tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan87">gangs.
</tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan89"><tspan
   style="font-weight:bold"
   id="tspan88">Location:</tspan> Any 3 spaces with police.
</tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan91"><tspan
   style="font-weight:bold"
   id="tspan90">Procedure:</tspan> In each space, roll for hits and add the number </tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan92">of police in the space.
</tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan94">* First, remove active rats <tspan
   style="font-style:italic"
   id="tspan93">(If the space is an emergency </tspan></tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan96"><tspan
   style="font-style:italic"
   id="tspan95">zone, may spend one hit to flip an underground rat to active.)</tspan>
</tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan97">* Remove arms caches or the moss grower only once no rats </tspan><tspan
         x="99.986328"
         y="1424.7014"
         id="tspan98">remain.
</tspan><tspan
         x="99.986328"
         y="1461.368"
         id="tspan99">* If more than 2 hits remain: remove a gangster, or if none, </tspan><tspan
         x="99.986328"
         y="1498.0346"
         id="tspan100">remove a civilian.
</tspan><tspan
         x="99.986328"
         y="1534.7013"
         id="tspan101">If any civilians were removed, add a terror to the space.
</tspan></text>
    <rect
       style="vector-effect:non-scaling-stroke;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.774579;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
