       y="2029.6964"
       rx="75.590553"
       ry="45.352676" />
    <text
       xml:space="preserve"
       id="text24"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect24);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-37.999957,1019.0221)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan103"><tspan
           style="font-weight:bold"
           id="tspan102">NOTES:
</tspan></tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan105"><tspan
           style="font-size:26.6667px"
           id="tspan104">*1: When removing arms caches or the moss grower, increase political </tspan></tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan107"><tspan
           style="font-size:26.6667px"
           id="tspan106">will by 1. When removing the moss grower, shift the moss track down </tspan></tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan109"><tspan
           style="font-size:26.6667px"
           id="tspan108">one space and halve moss profits (round down).
</tspan></tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan111"><tspan
           style="font-size:26.6667px"
           id="tspan110">* 2: Civilians and gangsters removed by government ops or specials are </tspan></tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan113"><tspan
           style="font-size:26.6667px"
           id="tspan112">always placed in the government's collateral box.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text26"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect27);display:inline;vector-effect:non-scaling-stroke;fill:#ffffff;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline" />
  </g>
</svg>
