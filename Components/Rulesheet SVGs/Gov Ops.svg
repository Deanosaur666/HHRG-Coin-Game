    <text
       xml:space="preserve"
       id="text25"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect26);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-13.664173,120.65275)"><tspan
         x="99.986328"
         y="467.12692"
         id="tspan35"><tspan
   style="font-weight:bold"
   id="tspan34">Sweep</tspan>
</tspan><tspan
         x="99.986328"
         y="503.79355"
         id="tspan37"><tspan
   style="font-weight:bold"
   id="tspan36">Location</tspan>: Any destination spaces (not foreign spaces).
</tspan><tspan
         x="99.986328"
         y="540.46018"
         id="tspan39"><tspan
   style="font-weight:bold"
   id="tspan38">Procedure</tspan>: Move police from adjacent spaces, then:
</tspan><tspan
         x="99.986328"
         y="577.1268"
         id="tspan41">* When sweeping into <tspan
   style="font-style:italic"
   id="tspan40">active</tspan> emergency zones, may reveal all </tspan><tspan
         x="99.986328"
         y="613.79343"
         id="tspan42">rat cells, OR assault.
</tspan><tspan
         x="99.986328"
         y="650.46005"
         id="tspan44">* If the space has a <tspan
   style="font-style:italic"
   id="tspan43">passive</tspan> emergency zone or no opposition, </tspan><tspan
         x="99.986328"
         y="687.12668"
         id="tspan45">reveal one cell for every police.
</tspan><tspan
         x="99.986328"
         y="723.79331"
         id="tspan46">* If the space is at opposition, reveal one cell for every two </tspan><tspan
         x="99.986328"
         y="760.45993"
         id="tspan47">police there.
</tspan><tspan
         x="99.986328"
         y="797.12656"
         id="tspan48">Then, if destination space is a district with sabotage, terror or </tspan><tspan
         x="99.986328"
         y="833.79318"
         id="tspan49">rat pieces, may place a passive emergency zone.
</tspan><tspan
         x="99.986328"
         y="870.45981"
         id="tspan51"><tspan
           style="font-style:italic"
           id="tspan50">Note: Each police can move only once.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text29"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect29);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-22.485282,63.834769)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan53"><tspan
   style="font-weight:bold"
   id="tspan52">Assault</tspan>
</tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan55"><tspan
   style="font-weight:bold"
   id="tspan54">Location:</tspan> Any 3 spaces with police.
</tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan57"><tspan
   style="font-weight:bold"
   id="tspan56">Procedure:</tspan> In each space, roll for hits and add the number </tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan58">of police in the space.
</tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan60">* First, remove active rats <tspan
   style="font-style:italic"
   id="tspan59">(If the space is an emergency </tspan></tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan62"><tspan
   style="font-style:italic"
   id="tspan61">zone, may spend one hit to flip an underground rat to active.)</tspan>
</tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan63">* Remove arms caches or the moss grower only once no rats </tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan64">remain.
</tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan65">* If more than 2 hits remain: remove a gangster, or if none, </tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan66">remove a civilian.
</tspan><tspan
         x="99.986328"
         y="1424.7014"
         id="tspan67">If any civilians were removed, add a terror to the space.
</tspan></text>
    <rect
       style="vector-effect:non-scaling-stroke;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.774579;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       id="rect18"
       width="1029.5918"
       height="261.83078"
       x="25.204113"
       y="2029.6964"
       rx="75.590553"
       ry="45.352676" />
    <text
       xml:space="preserve"
       id="text24"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect24);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-37.999957,1019.0221)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan69"><tspan
           style="font-weight:bold"
           id="tspan68">NOTES:
</tspan></tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan71"><tspan
           style="font-size:26.6667px"
           id="tspan70">*1: When removing arms caches or the moss grower, increase political </tspan></tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan73"><tspan
           style="font-size:26.6667px"
           id="tspan72">will by 1. When removing the moss grower, shift the moss track down </tspan></tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan75"><tspan
           style="font-size:26.6667px"
           id="tspan74">one space and halve moss profits (round down).
</tspan></tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan77"><tspan
           style="font-size:26.6667px"
           id="tspan76">* 2: Civilians and gangsters removed by government ops or specials are </tspan></tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan79"><tspan
           style="font-size:26.6667px"
           id="tspan78">always placed in the government's collateral box.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text26"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect27);display:inline;vector-effect:non-scaling-stroke;fill:#ffffff;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline" />
    <rect
       style="vector-effect:non-scaling-stroke;fill:#d3f3f3;fill-opacity:1;stroke:#000000;stroke-width:1.08774;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       id="rect6"
       width="997.47412"
       height="396.50952"
       x="41.262951"
       y="1573.712"
       rx="85.678612"
       ry="85.810616" />
    <text
       xml:space="preserve"
       id="text16"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect16);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(-20.485282,1467.7264)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan81"><tspan
   style="font-weight:bold"
   id="tspan80">Pacify</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan83"><tspan
   style="font-weight:bold"
   id="tspan82">Location: </tspan>Districts with police
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan85"><tspan
   style="font-weight:bold"
   id="tspan84">Procedure: </tspan>In each space:
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan86">Place an active politician or move an active politician to the </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan87">space. Then, for each politician in that space, may remove a </tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan89">terror or sabotage from the space, or, <tspan
   style="font-style:italic"
   id="tspan88">if no terror or </tspan></tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan91"><tspan
   style="font-style:italic"
   id="tspan90">sabotage</tspan>, may shift the space towards support. Then, flip all </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan92">underground politicians there to active.
</tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan94"><tspan
           style="font-style:italic"
           id="tspan93">Note: Each politician may only move once.</tspan></tspan></text>
  </g>
</svg>
