    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="265.12305"
         y="61.023438"
         id="tspan3"><tspan
           style="font-weight:bold"
           id="tspan1">GOVERNMENT OPS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(-20.485282,-27.698486)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan7"><tspan
   style="font-weight:bold"
   id="tspan6">Mobilize</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan11"><tspan
   style="font-weight:bold"
   id="tspan10">Location: </tspan>Districts, LOCs, or Strategic centers.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan13"><tspan
   style="font-weight:bold"
   id="tspan12">Procedure:</tspan>
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan14">In each space, pick 1:
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan21"><tspan
   style="font-weight:bold"
   id="tspan15">A</tspan>: <tspan
   style="font-style:italic"
   id="tspan20">If police station</tspan>, place up to 3 police if un-sabotaged, or 1 </tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan22">if sabotaged.
</tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan25"><tspan
   style="font-weight:bold"
   id="tspan23">B</tspan>: <tspan
   style="font-style:italic"
   id="tspan24">If LOCs with at least 2 police, or Strategic Centers with at </tspan></tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan27"><tspan
   style="font-style:italic"
   id="tspan26">least 3 police</tspan>, remove a sabotage
</tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan32"><tspan
   style="font-weight:bold"
   id="tspan28">C</tspan>: <tspan
   style="font-style:italic"
   id="tspan29">If District with a passive emergency zone and a police,</tspan> flip </tspan><tspan
         x="101.01562"
         y="492.01523"
         id="tspan33">the emergency zone to active.
</tspan></text>
    <g
       id="g42"
       style="display:none"
       inkscape:label="Reference">
      <path
         style="display:inline;vector-effect:non-scaling-stroke;fill:none;fill-opacity:1;stroke:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
