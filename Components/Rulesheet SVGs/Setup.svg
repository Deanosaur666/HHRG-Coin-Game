    <text
       xml:space="preserve"
       id="text9"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect9-9);display:inline;vector-effect:non-scaling-stroke;fill:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0.2576714,-81.972064)"><tspan
         x="99.986328"
         y="1895.5429"
         id="tspan84"><tspan
   style="font-weight:bold"
   id="tspan83">Shootouts</tspan>
</tspan><tspan
         x="99.986328"
         y="1932.2096"
         id="tspan85">Shootout &quot;power&quot; is gangsters + terror markers.
</tspan><tspan
         x="99.986328"
         y="1968.8762"
         id="tspan87"><tspan
   style="font-style:italic"
   id="tspan86">(&quot;Shootout checks&quot; require rolling eqal or under power.)</tspan>
</tspan><tspan
         x="99.986328"
         y="2005.5428"
         id="tspan88">Remove pieces equal to power, until only 1 remains, in </tspan><tspan
         x="99.986328"
         y="2042.2094"
         id="tspan89">alternating order:
</tspan><tspan
         x="99.986328"
         y="2078.8759"
         id="tspan90">- Neutral cube (first civilians, then gangsters, then militia)
</tspan><tspan
         x="99.986328"
         y="2115.5425"
         id="tspan91">- Active rat (or reveal underground rat if none active)
</tspan><tspan
         x="99.986328"
         y="2152.209"
         id="tspan92">
</tspan><tspan
         x="99.986328"
         y="2188.8755"
         id="tspan93">The last neutral cube in a space will never be removed by a </tspan><tspan
         x="99.986328"
         y="2225.542"
         id="tspan94">shootout.
</tspan><tspan
         x="99.986328"
         y="2262.2085"
         id="tspan95">
</tspan><tspan
         x="99.986328"
         y="2298.875"
         id="tspan96">Any active politicians in the space are flipped underground.</tspan></text>
  </g>
