    <text
       xml:space="preserve"
       id="text56"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect56-9);display:inline;vector-effect:non-scaling-stroke;fill:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-12.658939,-1786.5732)"><tspan
         x="99.986328"
         y="1895.5429"
         id="tspan8"><tspan
           style="font-weight:bold"
           id="tspan7">Setup
</tspan></tspan><tspan
         x="99.986328"
         y="1932.2096"
         id="tspan12"><tspan
           style="font-weight:bold"
           id="tspan9">
</tspan></tspan><tspan
         x="99.986328"
         y="1968.8762"
         id="tspan15">Politcal will starts at 14<tspan
   style="font-weight:bold"
   id="tspan13">
</tspan></tspan><tspan
         x="99.986328"
         y="2005.5428"
         id="tspan17"><tspan
           style="font-weight:bold"
           id="tspan16">
</tspan></tspan><tspan
         x="99.986328"
         y="2042.2094"
         id="tspan19"><tspan
           style="font-weight:bold"
           id="tspan18">U Party
</tspan></tspan><tspan
         x="99.986328"
         y="2078.8759"
         id="tspan21"><tspan
           style="font-weight:bold"
           id="tspan20">
</tspan></tspan><tspan
         x="99.986328"
         y="2115.5425"
         id="tspan22">Place 2 police in each police station.
</tspan><tspan
         x="99.986328"
         y="2152.209"
         id="tspan23">
</tspan><tspan
         x="99.986328"
         y="2188.8755"
         id="tspan24">The U Party player chooses two non-southern districts. Place </tspan><tspan
         x="99.986328"
         y="2225.542"
         id="tspan25">an active politician, police, and support.
</tspan><tspan
         x="99.986328"
         y="2262.2085"
         id="tspan28">(6 total police out.)<tspan
   style="font-weight:bold"
   id="tspan26">
</tspan></tspan><tspan
         x="99.986328"
         y="2298.875"
         id="tspan30"><tspan
           style="font-weight:bold"
           id="tspan29">
</tspan></tspan><tspan
         x="99.986328"
         y="2335.5415"
         id="tspan32"><tspan
           style="font-weight:bold"
           id="tspan31">Rats
</tspan></tspan><tspan
         x="99.986328"
         y="2372.208"
         id="tspan34"><tspan
           style="font-weight:bold"
           id="tspan33">
</tspan></tspan><tspan
         x="99.986328"
         y="2408.8745"
         id="tspan35">The Rats player places two rats in each foreign space, and </tspan><tspan
         x="99.986328"
         y="2445.541"
         id="tspan36">an arms cache in one of them. Then, they choose one </tspan><tspan
         x="99.986328"
         y="2482.2075"
         id="tspan37">southern space and place the moss grower, 2 rats, and </tspan><tspan
         x="99.986328"
         y="2518.874"
         id="tspan38">opposition in them.
</tspan><tspan
         x="99.986328"
         y="2555.5405"
         id="tspan39">
</tspan><tspan
         x="99.986328"
         y="2592.207"
         id="tspan40">Then, the Rats player places one rat in every other space </tspan><tspan
         x="99.986328"
         y="2628.8735"
         id="tspan43">without a politician.<tspan
   style="font-weight:bold"
   id="tspan42">
</tspan></tspan><tspan
         x="99.986328"
         y="2665.54"
         id="tspan45"><tspan
           style="font-weight:bold"
           id="tspan44">
</tspan></tspan><tspan
         x="99.986328"
         y="2702.2065"
         id="tspan47"><tspan
           style="font-weight:bold"
           id="tspan46">Neutral cubes
</tspan></tspan><tspan
         x="99.986328"
         y="2738.873"
         id="tspan49"><tspan
   style="font-style:italic"
   id="tspan48">Salem, Radio Ridge East</tspan>: 2 Civilians
</tspan><tspan
         x="99.986328"
         y="2775.5395"
         id="tspan51"><tspan
   style="font-style:italic"
   id="tspan50">Radio Ridge West</tspan>: 3 civilians
</tspan><tspan
         x="99.986328"
         y="2812.206"
         id="tspan53"><tspan
   style="font-style:italic"
   id="tspan52">Alkali, Quartz Coast: </tspan>1 civilian, 1 gangster
</tspan><tspan
         x="99.986328"
         y="2848.8725"
         id="tspan55"><tspan
   style="font-style:italic"
   id="tspan54">Gold Basin:</tspan> 2 civilians, 1 gangster
</tspan><tspan
         x="99.986328"
         y="2885.539"
         id="tspan58"><tspan
   style="font-style:italic"
   id="tspan56">Fort David, Logan</tspan>: 2 gangsters.<tspan
   style="font-weight:bold"
   id="tspan57">
</tspan></tspan><tspan
         x="99.986328"
         y="2922.2055"
         id="tspan60"><tspan
           style="font-weight:bold"
           id="tspan59">
</tspan></tspan><tspan
         x="99.986328"
         y="2958.872"
         id="tspan62"><tspan
           style="font-weight:bold"
           id="tspan61">Available and out of play
</tspan></tspan><tspan
         x="99.986328"
         y="2995.5385"
         id="tspan78"><tspan
           style="font-weight:bold"
           id="tspan63">
</tspan></tspan><tspan
         x="99.986328"
         y="3032.205"
         id="tspan79">4 police will be in available, and 8 will be in out of play.
</tspan><tspan
         x="99.986328"
         y="3068.8716"
         id="tspan80">
</tspan><tspan
         x="99.986328"
         y="3105.5381"
         id="tspan81">2 politicians will be on the map, 4 will be available, 4 will be </tspan><tspan
         x="99.986328"
         y="3142.2046"
         id="tspan82">out of play. (10 total)</tspan></text>
