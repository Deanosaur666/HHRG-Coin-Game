       x="1063.4886"
       y="1013.246"
       rx="75.590553"
       ry="2.8284271" />
    <text
       xml:space="preserve"
       id="text5"
       style="font-size:26.6667px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect5);display:inline;vector-effect:non-scaling-stroke;fill:#aaeded;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline" />
