         y="125.93942"
         id="tspan87"><tspan
   style="font-weight:bold"
   id="tspan85">Note:</tspan> R<tspan
   style="font-size:26.6667px"
   id="tspan86">at ops are limited by the ops value of the moss track.</tspan></tspan></text>
