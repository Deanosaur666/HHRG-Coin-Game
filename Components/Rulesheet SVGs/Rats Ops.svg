    <text
       xml:space="preserve"
       id="text1"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect1);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-452.40509"
       y="0"
       transform="translate(-40.233865,148.81988)"><tspan
         x="99.986328"
         y="125.93942"
         id="tspan15"><tspan
   style="font-weight:bold"
   id="tspan14">Rally</tspan>
</tspan><tspan
         x="99.986328"
         y="162.60605"
         id="tspan17"><tspan
   style="font-weight:bold"
   id="tspan16">Location:</tspan> Foreign spaces and non-support districts.
</tspan><tspan
         x="99.986328"
         y="199.27268"
         id="tspan19"><tspan
   style="font-weight:bold"
   id="tspan18">Procedure:</tspan> In each selected space:
</tspan><tspan
         x="99.986328"
         y="235.9393"
         id="tspan21">* <tspan
   style="font-style:italic"
   id="tspan20">If foreign spaces or moss grower</tspan>, may place two cells 
</tspan><tspan
         x="99.986328"
         y="272.60593"
         id="tspan24">* <tspan
   style="font-style:italic"
   id="tspan23">Otherwise</tspan>, may place one cell
</tspan><tspan
         x="99.986328"
         y="309.27255"
         id="tspan25">
</tspan><tspan
         x="99.986328"
         y="345.93918"
         id="tspan27"><tspan
           style="font-style:italic"
           id="tspan26">Note: Rally may take Rat cells from spaces without active </tspan></tspan><tspan
         x="99.986328"
         y="382.60581"
         id="tspan29"><tspan
           style="font-style:italic"
           id="tspan28">emergency zones if none are in available.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text7"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect7);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-39.671223,142.71783)"><tspan
         x="99.986328"
         y="501.9531"
         id="tspan31"><tspan
   style="font-weight:bold"
   id="tspan30">Travel</tspan>
</tspan><tspan
         x="99.986328"
         y="538.61972"
         id="tspan33"><tspan
   style="font-weight:bold"
   id="tspan32">Location:</tspan> Any origin spaces without emergency zones.
</tspan><tspan
         x="99.986328"
         y="575.28635"
         id="tspan35"><tspan
   style="font-weight:bold"
   id="tspan34">Procedure:</tspan> Move Rat cells to adjacent spaces. Then:
</tspan><tspan
         x="99.986328"
         y="611.95297"
         id="tspan36">* If destination is an emergency zone, strategic center, or LOC, </tspan><tspan
         x="99.986328"
         y="648.6196"
         id="tspan37">and moving cells plus police and active politicians there exceed </tspan><tspan
         x="99.986328"
         y="685.28623"
         id="tspan38">3, flip moving cells to active.
</tspan><tspan
         x="99.986328"
         y="721.95285"
         id="tspan39">* Otherwise, if the destination is at oppose, may flip moving cells </tspan><tspan
         x="99.986328"
         y="758.61948"
         id="tspan40">underground.
</tspan><tspan
         x="99.986328"
         y="795.2861"
         id="tspan42"><tspan
           style="font-style:italic"
           id="tspan41">Note: Movement may be chained.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text12"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect12);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-39.986327,490.04675)"><tspan
         x="99.986328"
         y="979.9531"
         id="tspan44"><tspan
   style="font-weight:bold"
   id="tspan43">Bombing</tspan>
</tspan><tspan
         x="99.986328"
         y="1016.6197"
         id="tspan46"><tspan
   style="font-weight:bold"
   id="tspan45">Location:</tspan> Spaces with underground cells, adjacent to or at arms </tspan><tspan
         x="99.986328"
         y="1053.2863"
         id="tspan47">caches.
</tspan><tspan
         x="99.986328"
         y="1089.953"
         id="tspan49"><tspan
   style="font-weight:bold"
   id="tspan48">Procedure:</tspan> In each selected space, must activate an </tspan><tspan
         x="99.986328"
         y="1126.6196"
         id="tspan50">underground cell, and may remove arms caches from the space </tspan><tspan
         x="99.986328"
         y="1163.2862"
         id="tspan51">and adjacent spaces, and determine power by rolling one dice </tspan><tspan
         x="99.986328"
         y="1199.9529"
         id="tspan52">per arms cache removed.
</tspan><tspan
         x="99.986328"
         y="1236.6195"
         id="tspan53">* First, must remove police cubes for 2 power each.
</tspan><tspan
         x="99.986328"
         y="1273.2861"
         id="tspan54">* Then, once no police, may remove armored cars (max 1 per </tspan><tspan
         x="99.986328"
         y="1309.9527"
         id="tspan55">bombing, -1 PW).
</tspan><tspan
         x="99.986328"
         y="1346.6194"
         id="tspan56">* Then, may remove politicians.
</tspan><tspan
         x="99.986328"
         y="1383.286"
         id="tspan57">* If more than 2 hits remain, remove a civilian, or if none, a </tspan><tspan
         x="99.986328"
         y="1419.9526"
         id="tspan58">gangster.
</tspan><tspan
         x="99.986328"
         y="1456.6192"
         id="tspan60"><tspan
   style="font-weight:bold"
   id="tspan59">Then:</tspan>
</tspan><tspan
         x="99.986328"
         y="1493.2859"
         id="tspan61">* If space is an LOC, place a sabotage if none.
</tspan><tspan
         x="99.986328"
         y="1529.9525"
         id="tspan64">* Otherwise, place a terror if none.
</tspan><tspan
         x="99.986328"
         y="1566.6191"
         id="tspan65">* Goverment must place a passive emergency zone if no </tspan><tspan
         x="99.986328"
         y="1603.2857"
         id="tspan67">emergency zone.
</tspan><tspan
         x="99.986328"
         y="1639.9524"
         id="tspan68">* If there are any surviving active politicians in the space, flip </tspan><tspan
         x="99.986328"
         y="1676.619"
         id="tspan70">them underground.
</tspan></text>
    <text
       xml:space="preserve"
       id="text17"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect17);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-39.986327,-925.85159)"><tspan
         x="99.986328"
         y="2005.8515"
         id="tspan72"><tspan
   style="font-weight:bold"
   id="tspan71">Sabotage</tspan>
</tspan><tspan
         x="99.986328"
         y="2042.5182"
         id="tspan74"><tspan
   style="font-weight:bold"
   id="tspan73">Location:</tspan> Any spaces with underground cells and no active </tspan><tspan
         x="99.986328"
         y="2079.1848"
         id="tspan75">politicians
</tspan><tspan
         x="99.986328"
         y="2115.8515"
         id="tspan77"><tspan
   style="font-weight:bold"
   id="tspan76">Procedure:</tspan> In each space reveal one underground cell, and </tspan><tspan
         x="99.986328"
         y="2152.518"
         id="tspan78">then place a sabotage if none.
</tspan><tspan
         x="99.986328"
         y="2189.1845"
         id="tspan80">* I<tspan
   style="font-style:italic"
   id="tspan79">f the space is at opposition,</tspan> may remove a passive emergency </tspan><tspan
         x="99.986328"
         y="2225.851"
         id="tspan81">zone there, or flip an active emergency zone to passive.
</tspan><tspan
         x="99.986328"
         y="2262.5175"
         id="tspan83">* <tspan
   style="font-style:italic"
   id="tspan82">Otherwise, If the space is a district,</tspan> shift it towards opposition.
</tspan><tspan
         x="99.986328"
         y="2299.1841"
         id="tspan84">
</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1.04749;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
