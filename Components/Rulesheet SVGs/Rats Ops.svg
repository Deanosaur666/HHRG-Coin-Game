    <text
       xml:space="preserve"
       id="text1"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect1);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-452.40509"
       y="0"
       transform="translate(0,127.82338)"><tspan
         x="99.986328"
         y="125.93942"
         id="tspan4"><tspan
   style="font-weight:bold"
   id="tspan3">Rally</tspan>
</tspan><tspan
         x="99.986328"
         y="162.60605"
         id="tspan6"><tspan
   style="font-weight:bold"
   id="tspan5">Location</tspan>: Foreign spaces and districts without support or </tspan><tspan
         x="99.986328"
         y="199.27268"
         id="tspan7">an emergency zone.
</tspan><tspan
         x="99.986328"
         y="235.9393"
         id="tspan23"><tspan
   style="font-weight:bold"
   id="tspan16">Procedure</tspan>: In each space place one cell, or <tspan
   style="font-style:italic"
   id="tspan17">if foreign </tspan></tspan><tspan
         x="99.986328"
         y="272.60593"
         id="tspan42"><tspan
   style="font-style:italic"
   id="tspan27">space or</tspan> <tspan
   style="font-style:italic"
   id="tspan41">if the moss grower is in that space</tspan>, 2 cells. Then, </tspan><tspan
         x="99.986328"
         y="309.27255"
         id="tspan44">may place arms caches in selected spaces, up to the arms </tspan><tspan
         x="99.986328"
         y="345.93918"
         id="tspan55">cache value on the moss track.
</tspan><tspan
         x="99.986328"
         y="382.60581"
         id="tspan57"><tspan
           style="font-style:italic"
           id="tspan56">Note: Rally may pull Rat cells from anywhere on the map if </tspan></tspan><tspan
         x="99.986328"
         y="419.27243"
         id="tspan88"><tspan
           style="font-style:italic"
           id="tspan60">none are available.
</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text7"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect7);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-5.6568544,170.71782)"><tspan
         x="99.986328"
         y="501.9531"
         id="tspan90"><tspan
   style="font-weight:bold"
   id="tspan89">Travel</tspan>
</tspan><tspan
         x="99.986328"
         y="538.61972"
         id="tspan92"><tspan
   style="font-weight:bold"
   id="tspan91">Location</tspan>: Any origin spaces without emergency zones.
</tspan><tspan
         x="99.986328"
         y="575.28635"
         id="tspan94"><tspan
   style="font-weight:bold"
   id="tspan93">Procedure</tspan>: Move Rat cells to adjacent spaces. Rats may </tspan><tspan
         x="99.986328"
         y="611.95297"
         id="tspan95">bring one gangster with them if the origin space was not at </tspan><tspan
         x="99.986328"
         y="648.6196"
         id="tspan96">support. Then:
</tspan><tspan
         x="99.986328"
         y="685.28623"
         id="tspan97">* If destination is an emergency zone, strategic center, or </tspan><tspan
         x="99.986328"
         y="721.95285"
         id="tspan98">LOC, and moving cells plus police and active politicians </tspan><tspan
         x="99.986328"
         y="758.61948"
         id="tspan99">there exceed 3, flip moving cells to active.
</tspan><tspan
         x="99.986328"
         y="795.2861"
         id="tspan100">* Otherwise, if the destination is at oppose, may flip </tspan><tspan
         x="99.986328"
         y="831.95273"
         id="tspan106">moving cells underground.
</tspan><tspan
         x="99.986328"
         y="868.61935"
         id="tspan107">If the destination space has terror, roll for a shootout.
</tspan><tspan
         x="99.986328"
         y="905.28598"
         id="tspan109"><tspan
   style="font-style:italic"
   id="tspan108">Note: Movement may be chained.</tspan>
</tspan></text>
    <text
       xml:space="preserve"
       id="text12"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect12);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-5.6568544,517.78886)"><tspan
         x="99.986328"
         y="979.9531"
         id="tspan111"><tspan
   style="font-weight:bold"
   id="tspan110">Bombing</tspan>
</tspan><tspan
         x="99.986328"
         y="1016.6197"
         id="tspan113"><tspan
   style="font-weight:bold"
   id="tspan112">Location</tspan>: Any spaces with underground cells, adjacent or </tspan><tspan
         x="99.986328"
         y="1053.2863"
         id="tspan114">with arms caches
</tspan><tspan
         x="99.986328"
         y="1089.953"
         id="tspan116"><tspan
   style="font-weight:bold"
   id="tspan115">Procedure</tspan>: In each selected space, remove an arms </tspan><tspan
         x="99.986328"
         y="1126.6196"
         id="tspan117">cache from the space or an adjacent space, activate an </tspan><tspan
         x="99.986328"
         y="1163.2862"
         id="tspan118">underground cell, and roll a dice.
</tspan><tspan
         x="99.986328"
         y="1199.9529"
         id="tspan119">- Attack power is equal half dice roll, rounded up. (1-3). </tspan><tspan
         x="99.986328"
         y="1236.6195"
         id="tspan120">Add one for each arms cache used.  Each piece removed </tspan><tspan
         x="99.986328"
         y="1273.2861"
         id="tspan121">costs one attack power.
</tspan><tspan
         x="99.986328"
         y="1309.9527"
         id="tspan122">* First, must remove police cubes (to out of play).
</tspan><tspan
         x="99.986328"
         y="1346.6194"
         id="tspan123">* Then, once no police, may remove an armored car, </tspan><tspan
         x="99.986328"
         y="1383.286"
         id="tspan124">reducing political will by 1, and then may place an arms </tspan><tspan
         x="99.986328"
         y="1419.9526"
         id="tspan125">cache in a district adjacent to the removed car.
</tspan><tspan
         x="99.986328"
         y="1456.6192"
         id="tspan127">* Then, may remove politicians. (See <tspan
   style="font-style:italic"
   id="tspan126">Assassination</tspan>).
</tspan><tspan
         x="99.986328"
         y="1493.2859"
         id="tspan128">* If remaining power is 2 or greater, remove a civilian, or if </tspan><tspan
         x="99.986328"
         y="1529.9525"
         id="tspan129">none, a gangster. (Either to collateral)
</tspan><tspan
         x="99.986328"
         y="1566.6191"
         id="tspan130">Then:
</tspan><tspan
         x="99.986328"
         y="1603.2857"
         id="tspan132">* If LOC or strategic center, place a sabotage <tspan
   style="font-style:italic"
   id="tspan131">if none</tspan>.
</tspan><tspan
         x="99.986328"
         y="1639.9524"
         id="tspan134">* Otherwise, place a terror <tspan
   style="font-style:italic"
   id="tspan133">if none</tspan>.
</tspan><tspan
         x="99.986328"
         y="1676.619"
         id="tspan135">* If there are any surviving active politicians in the space, </tspan><tspan
         x="99.986328"
         y="1713.2856"
         id="tspan136">flip them underground.
</tspan></text>
    <text
       xml:space="preserve"
       id="text17"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect17);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-5.6568544,-805.39284)"><tspan
         x="99.986328"
         y="2005.8515"
         id="tspan138"><tspan
   style="font-weight:bold"
   id="tspan137">Sabotage</tspan>
</tspan><tspan
         x="99.986328"
         y="2042.5182"
         id="tspan140"><tspan
   style="font-weight:bold"
   id="tspan139">Location</tspan>: Spaces with underground cells and no active </tspan><tspan
         x="99.986328"
         y="2079.1848"
         id="tspan141">politicians.
</tspan><tspan
         x="99.986328"
         y="2115.8515"
         id="tspan143"><tspan
   style="font-weight:bold"
   id="tspan142">Procedure</tspan>: In each space reveal one underground cell, </tspan><tspan
         x="99.986328"
         y="2152.518"
         id="tspan145">and then place a sabotage <tspan
   style="font-style:italic"
   id="tspan144">if none</tspan>. If the space is a district, </tspan><tspan
         x="99.986328"
         y="2189.1845"
         id="tspan146">shift it towards opposition.</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       id="rect13"
       width="929.5918"
       height="83.810959"
       x="75.204071"
       y="91.500374"
       rx="75.590553"
       ry="41.905479" />
    <text
       xml:space="preserve"
       id="text18"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect18);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-452.40509"
       y="0"
       transform="translate(0,17.514716)"><tspan
         x="99.986328"
         y="125.93942"
         id="tspan149"><tspan
   style="font-weight:bold"
   id="tspan147">Note:</tspan> <tspan
   style="font-size:26.6667px"
   id="tspan148">All rat ops are limited by the ops value of the moss track.</tspan></tspan></text>
    <rect
       style="vector-effect:non-scaling-stroke;fill:#aaeded;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       id="rect3"
       width="8.485281"
