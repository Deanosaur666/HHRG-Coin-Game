    <text
       xml:space="preserve"
       id="text1"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect1);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-452.40509"
       y="0"
       transform="translate(-40.233865,148.81988)"><tspan
         x="99.986328"
         y="125.93942"
         id="tspan8"><tspan
   style="font-weight:bold"
   id="tspan7">Rally</tspan>
</tspan><tspan
         x="99.986328"
         y="162.60605"
         id="tspan10"><tspan
   style="font-weight:bold"
   id="tspan9">Special Activities:</tspan> Traffic, Smuggle, or Hide
</tspan><tspan
         x="99.986328"
         y="199.27268"
         id="tspan13"><tspan
   style="font-weight:bold"
   id="tspan11">Location:</tspan> Foreign spaces and non-support districts.
</tspan><tspan
         x="99.986328"
         y="235.9393"
         id="tspan27"><tspan
   style="font-weight:bold"
   id="tspan22">Procedure:</tspan> In each selected space:
</tspan><tspan
         x="99.986328"
         y="272.60593"
         id="tspan35">* <tspan
   style="font-style:italic"
   id="tspan30">If foreign spaces or moss grower,</tspan> may place two cells.
</tspan><tspan
         x="99.986328"
         y="309.27255"
         id="tspan37">* <tspan
   style="font-style:italic"
   id="tspan36">Otherwise,</tspan> may place one cell.
</tspan><tspan
         x="99.986328"
         y="345.93918"
         id="tspan39">* <tspan
   style="font-style:italic"
   id="tspan38">Then, if foreign or oppose,</tspan> place an arms cache
</tspan><tspan
         x="99.986328"
         y="382.60581"
         id="tspan41">* <tspan
   style="font-style:italic"
   id="tspan40">Otherwise,</tspan> replace a cell with an arms cache.
</tspan><tspan
         x="99.986328"
         y="419.27243"
         id="tspan42">May not place more arms caches than the moss track allows.
</tspan><tspan
         x="99.986328"
         y="455.93906"
         id="tspan44"><tspan
           style="font-style:italic"
           id="tspan43">Note: Rally may take Rat cells and arms caches from spaces </tspan></tspan><tspan
         x="99.986328"
         y="492.60568"
         id="tspan46"><tspan
           style="font-style:italic"
           id="tspan45">without emergency zones if none are in available.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text7"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect7);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-39.671223,292.71782)"><tspan
         x="99.986328"
         y="501.9531"
         id="tspan48"><tspan
   style="font-weight:bold"
   id="tspan47">Travel</tspan>
</tspan><tspan
         x="99.986328"
         y="538.61972"
         id="tspan50"><tspan
   style="font-weight:bold"
   id="tspan49">Special Activities:</tspan> Any
</tspan><tspan
         x="99.986328"
         y="575.28635"
         id="tspan52"><tspan
   style="font-weight:bold"
   id="tspan51">Location:</tspan> Any origin spaces without emergency zones.
</tspan><tspan
         x="99.986328"
         y="611.95297"
         id="tspan54"><tspan
   style="font-weight:bold"
   id="tspan53">Procedure:</tspan> Move Rat cells to adjacent spaces. Then:
</tspan><tspan
         x="99.986328"
         y="648.6196"
         id="tspan55">* If destination is an emergency zone, strategic center, or LOC, </tspan><tspan
         x="99.986328"
         y="685.28623"
         id="tspan56">and moving cells plus police and active politicians there exceed </tspan><tspan
         x="99.986328"
         y="721.95285"
         id="tspan57">3, flip moving cells to active.
</tspan><tspan
         x="99.986328"
         y="758.61948"
         id="tspan58">* Otherwise, if the destination is at oppose, may flip moving cells </tspan><tspan
         x="99.986328"
         y="795.2861"
         id="tspan59">underground.
</tspan><tspan
         x="99.986328"
         y="831.95273"
         id="tspan61"><tspan
           style="font-style:italic"
           id="tspan60">Note: Movement may be chained.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text12"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect12);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-39.986327,640.04687)"><tspan
         x="99.986328"
         y="979.9531"
         id="tspan63"><tspan
   style="font-weight:bold"
   id="tspan62">Bombing</tspan>
</tspan><tspan
         x="99.986328"
         y="1016.6197"
         id="tspan65"><tspan
   style="font-weight:bold"
   id="tspan64">Special Activities:</tspan> Raid
</tspan><tspan
         x="99.986328"
         y="1053.2863"
         id="tspan67"><tspan
   style="font-weight:bold"
   id="tspan66">Location:</tspan> Any spaces with underground cells, adjacent to or at </tspan><tspan
         x="99.986328"
         y="1089.953"
         id="tspan68">arms caches.
</tspan><tspan
         x="99.986328"
         y="1126.6196"
         id="tspan70"><tspan
   style="font-weight:bold"
   id="tspan69">Procedure:</tspan> In each selected space, remove an arms cache from </tspan><tspan
         x="99.986328"
         y="1163.2862"
         id="tspan71">the space or an adjacent space, activate an underground cell, </tspan><tspan
         x="99.986328"
         y="1199.9529"
         id="tspan72">and roll for hits.
</tspan><tspan
         x="99.986328"
         y="1236.6195"
         id="tspan73">* First, must remove police cubes (to out of play).
</tspan><tspan
         x="99.986328"
         y="1273.2861"
         id="tspan74">* Then, must remove militia cubes, if any.
</tspan><tspan
         x="99.986328"
         y="1309.9527"
         id="tspan75">* Then, once no police, may remove armored cars (max 1 per </tspan><tspan
         x="99.986328"
         y="1346.6194"
         id="tspan76">bombing).
</tspan><tspan
         x="99.986328"
         y="1383.286"
         id="tspan77">* Then, may remove politicians.
</tspan><tspan
         x="99.986328"
         y="1419.9526"
         id="tspan78">* If more than 2 hits remain, remove a civilian, or if none, a </tspan><tspan
         x="99.986328"
         y="1456.6192"
         id="tspan79">gangster.
</tspan><tspan
         x="99.986328"
         y="1493.2859"
         id="tspan81"><tspan
   style="font-weight:bold"
   id="tspan80">Then:</tspan>
</tspan><tspan
         x="99.986328"
         y="1529.9525"
         id="tspan82">* If space is an LOC, place a sabotage if none.
</tspan><tspan
         x="99.986328"
         y="1566.6191"
         id="tspan83">* Otherwise, place a terror if none.
</tspan><tspan
         x="99.986328"
         y="1603.2857"
         id="tspan84">* If there are any surviving active politicians in the space, flip </tspan><tspan
         x="99.986328"
         y="1639.9524"
         id="tspan85">them underground.
</tspan></text>
    <text
       xml:space="preserve"
       id="text17"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect17);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-39.986327,-745.85156)"><tspan
         x="99.986328"
         y="2005.8515"
         id="tspan87"><tspan
   style="font-weight:bold"
   id="tspan86">Sabotage</tspan>
</tspan><tspan
         x="99.986328"
         y="2042.5182"
         id="tspan89"><tspan
   style="font-weight:bold"
   id="tspan88">Special Activities:</tspan> Traffic or Raid
</tspan><tspan
         x="99.986328"
         y="2079.1848"
         id="tspan91"><tspan
   style="font-weight:bold"
   id="tspan90">Location:</tspan> Any spaces with underground cells and no active </tspan><tspan
         x="99.986328"
         y="2115.8515"
         id="tspan92">politicians
</tspan><tspan
         x="99.986328"
         y="2152.518"
         id="tspan94"><tspan
   style="font-weight:bold"
   id="tspan93">Procedure:</tspan> In each space reveal one underground cell, and </tspan><tspan
         x="99.986328"
         y="2189.1845"
         id="tspan95">then place a sabotage if none. If the space is a district, shift it </tspan><tspan
         x="99.986328"
         y="2225.851"
         id="tspan96">towards opposition.
</tspan><tspan
         x="99.986328"
         y="2262.5175"
         id="tspan97">
</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1.04749;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
