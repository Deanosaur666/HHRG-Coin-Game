</tspan><tspan
         x="99.986328"
         y="472.74081"
         id="tspan107"><tspan
   style="font-weight:bold"
   id="tspan106">Purpose</tspan>: Add civilian cubes and move rats.
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan109"><tspan
   style="font-weight:bold"
   id="tspan108">Location</tspan>: Any district with an active politician.
</tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan111"><tspan
   style="font-weight:bold"
   id="tspan110">Procedure</tspan>: Flip an active politician in the district </tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan112">underground. Then, may add one civilian cube to the </tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan113">space, and may move one rat cell in the selected space to </tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan114">an adjacent space.</tspan></text>
