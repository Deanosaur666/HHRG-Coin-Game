         id="tspan81"><tspan
   style="font-weight:bold"
   id="tspan80">Location</tspan>: Any space with police and sabotage.
</tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan83"><tspan
   style="font-weight:bold"
   id="tspan82">Procedure</tspan>: Remove all sabotage from the space.</tspan></text>
    <text
       xml:space="preserve"
       id="text13"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect13);display:inline;vector-effect:non-scaling-stroke;fill:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
