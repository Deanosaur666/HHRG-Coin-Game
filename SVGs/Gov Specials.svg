   id="tspan10">ECON</tspan>
</tspan><tspan
         x="99.986328"
         y="1494.6197"
         id="tspan38"><tspan
   style="font-weight:bold"
   id="tspan15">Procedure</tspan>: Perform the <tspan
   style="font-style:italic"
   id="tspan16">supply</tspan> special activity.</tspan></text>
    <text
       xml:space="preserve"
       id="text33"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect33);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,342.74222)"><tspan
         x="99.986328"
         y="1651.9531"
         id="tspan42"><tspan
   style="font-weight:bold"
   id="tspan40">Armored Car Movement</tspan>
</tspan><tspan
         x="99.986328"
         y="1688.6197"
         id="tspan47"><tspan
   style="font-weight:bold"
   id="tspan43">Procedure</tspan>: At the start of each event phase, the </tspan><tspan
         x="99.986328"
         y="1725.2863"
         id="tspan48">government may move a number of armored cars based on </tspan><tspan
         x="99.986328"
         y="1761.953"
         id="tspan49">the event roll. 
</tspan><tspan
         x="99.986328"
         y="1798.6196"
         id="tspan51">Armored cars on sabotaged LOCs cannot move. Each </tspan><tspan
         x="99.986328"
         y="1835.2862"
         id="tspan53">selected car moves towards a police station along its LOC.
</tspan><tspan
         x="99.986328"
         y="1871.9529"
         id="tspan55">
</tspan><tspan
         x="99.986328"
         y="1908.6195"
         id="tspan56">Whenever an armored car moves, a single police cube on </tspan><tspan
         x="99.986328"
         y="1945.2861"
         id="tspan58">its origin space may move with it.</tspan></text>
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="52.392578"
         y="61.023438"
         id="tspan60"><tspan
           style="font-weight:bold"
           id="tspan59">GOVERNMENT SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan62"><tspan
   style="font-weight:bold"
   id="tspan61">Supply</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan64"><tspan
   style="font-weight:bold"
   id="tspan63">Purpose</tspan>: Place armored cars to increase police supply.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan66"><tspan
   style="font-weight:bold"
   id="tspan65">Location</tspan>: Any un-sabotaged factory.
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan72"><tspan
   style="font-weight:bold"
   id="tspan69">Procedure</tspan>: Place an armored car at the selected space, </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan74">and then may place an available police there.</tspan></text>
