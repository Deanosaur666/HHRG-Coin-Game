   id="tspan49">Campaign</tspan>
</tspan><tspan
         x="99.986328"
         y="472.74081"
         id="tspan52"><tspan
   style="font-weight:bold"
   id="tspan51">Location</tspan>: Any district with an active politician.
</tspan><tspan
         x="99.986328"
         y="509.40744"
         id="tspan54"><tspan
   style="font-weight:bold"
   id="tspan53">Procedure</tspan>: Flip an active politician in the district </tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan55">underground. Then, may either.
</tspan><tspan
         x="99.986328"
         y="582.74069"
         id="tspan56">* Add one civilian cube to the space
</tspan><tspan
         x="99.986328"
         y="619.40732"
         id="tspan57">* Place an emergency zone
</tspan><tspan
         x="99.986328"
         y="656.07394"
         id="tspan58">Then, may move one rat cell in the selected space to an </tspan><tspan
         x="99.986328"
         y="692.74057"
         id="tspan59">adjacent space.</tspan></text>
