   id="tspan25">supply</tspan> special activity.</tspan></text>
    <text
       xml:space="preserve"
       id="text33"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect33);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,331.42851)"><tspan
         x="99.986328"
         y="1651.9531"
         id="tspan28"><tspan
   style="font-weight:bold"
   id="tspan27">Armored Car Movement</tspan>
</tspan><tspan
         x="99.986328"
         y="1688.6197"
         id="tspan30"><tspan
   style="font-weight:bold"
   id="tspan29">Procedure</tspan>: At the start of each event phase, the </tspan><tspan
         x="99.986328"
         y="1725.2863"
         id="tspan31">government may move a number of armored cars based on </tspan><tspan
         x="99.986328"
         y="1761.953"
         id="tspan32">the event roll. 
</tspan><tspan
         x="99.986328"
         y="1798.6196"
         id="tspan33">Armored cars on sabotaged LOCs cannot move. Each </tspan><tspan
         x="99.986328"
         y="1835.2862"
         id="tspan34">selected car moves towards a police station along its LOC.
</tspan><tspan
         x="99.986328"
         y="1871.9529"
         id="tspan35">
</tspan><tspan
         x="99.986328"
         y="1908.6195"
         id="tspan36">Whenever an armored car moves, a single police cube on </tspan><tspan
         x="99.986328"
         y="1945.2861"
         id="tspan37">its origin space may move with it.</tspan></text>
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
