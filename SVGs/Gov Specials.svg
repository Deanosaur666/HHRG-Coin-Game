         y="509.40744"
         id="tspan64">zone, and with civilians
</tspan><tspan
         x="99.986328"
         y="546.07407"
         id="tspan66"><tspan
   style="font-weight:bold"
   id="tspan65">Procedure</tspan>:  In selected space, reveal one rat per civilian </tspan><tspan
