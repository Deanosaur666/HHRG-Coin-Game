         x="99.986328"
         y="665.1777"
         id="tspan85"><tspan
   style="font-weight:bold"
   id="tspan84">Artillery</tspan>
</tspan><tspan
         x="99.986328"
         y="701.84433"
         id="tspan87"><tspan
           style="font-style:italic"
           id="tspan86">Only available if artillery strategic center is not sabotaged. </tspan></tspan><tspan
         x="99.986328"
         y="738.51096"
         id="tspan89"><tspan
   style="font-style:italic"
   id="tspan88">Does not accompany any op (counts as full OP+SA),</tspan>
</tspan><tspan
         x="99.986328"
         y="775.17758"
         id="tspan91"><tspan
   style="font-weight:bold"
   id="tspan90">Purpose</tspan>: Remove all pieces from a space.
</tspan><tspan
         x="99.986328"
         y="811.84421"
         id="tspan93"><tspan
   style="font-weight:bold"
   id="tspan92">Location</tspan>: Any district or foreign space.
</tspan><tspan
         x="99.986328"
         y="848.51083"
         id="tspan95"><tspan
   style="font-weight:bold"
   id="tspan94">Procedure</tspan>: As a cost, remove 3 police from the map and </tspan><tspan
         x="99.986328"
         y="885.17746"
         id="tspan96">available to out of play. Then remove all pieces, except </tspan><tspan
         x="99.986328"
         y="921.84409"
         id="tspan98">sabotage, from the space (police to out of play). <tspan
   style="font-style:italic"
   id="tspan97">If the </tspan></tspan><tspan
         x="99.986328"
         y="958.51071"
         id="tspan100"><tspan
   style="font-style:italic"
   id="tspan99">target space is a foreign space</tspan>, shift the moss track down </tspan><tspan
         x="99.986328"
         y="995.17734"
         id="tspan101">once and lose one political will.</tspan></text>
