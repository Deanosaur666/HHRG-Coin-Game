   style="font-weight:bold"
   id="tspan40">Supply</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan43"><tspan
   style="font-weight:bold"
   id="tspan42">Location</tspan>: Any un-sabotaged factory.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan45"><tspan
   style="font-weight:bold"
   id="tspan44">Procedure</tspan>: Place an armored car at the selected space, </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan46">and then may place an available police there.</tspan></text>
