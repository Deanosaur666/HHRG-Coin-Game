    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="244.38086"
         y="61.023438"
         id="tspan13"><tspan
           style="font-weight:bold"
           id="tspan12">PROPAGANA ROUND</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(0,-39.743506)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan14">All armored cars move.
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan15">
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan17"><tspan
   style="font-weight:bold"
   id="tspan16">Shootouts</tspan>
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan18">In every space with gangsters or terror, roll for a shootout </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan19">(see below).
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan20">
</tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan22"><tspan
   style="font-weight:bold"
   id="tspan21">Bombing</tspan>
</tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan23">Rats may perform one free bombing (attack option B).
</tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan24">
</tspan><tspan
         x="101.01562"
         y="492.01523"
         id="tspan26"><tspan
   style="font-weight:bold"
   id="tspan25">Politicians</tspan>
</tspan><tspan
         x="101.01562"
         y="528.68185"
         id="tspan27">Political will increases by one for every surviving active </tspan><tspan
         x="101.01562"
         y="565.34848"
         id="tspan28">politician on the map. Then, in each space with an active </tspan><tspan
         x="101.01562"
         y="602.01511"
         id="tspan29">politician, government may replace one gang member with </tspan><tspan
         x="101.01562"
         y="638.68173"
         id="tspan30">a civilian, or place a civilian.
</tspan><tspan
         x="101.01562"
         y="675.34836"
         id="tspan31">Then, flip all politicians active.
</tspan><tspan
         x="101.01562"
         y="712.01498"
         id="tspan32">
</tspan><tspan
         x="101.01562"
         y="748.68161"
         id="tspan34"><tspan
   style="font-weight:bold"
   id="tspan33">Score population</tspan>
</tspan><tspan
         x="101.01562"
         y="785.34824"
         id="tspan35">Political will changes by the sum of the following: In each </tspan><tspan
         x="101.01562"
         y="822.01486"
         id="tspan36">space, determine the difference between the number of </tspan><tspan
         x="101.01562"
         y="858.68149"
         id="tspan37">civilian cubes and the space's base population value. 
</tspan><tspan
         x="101.01562"
         y="895.34811"
         id="tspan38">
</tspan><tspan
         x="101.01562"
         y="932.01474"
         id="tspan40"><tspan
   style="font-weight:bold"
   id="tspan39">Score sabotage</tspan>
</tspan><tspan
         x="101.01562"
         y="968.68137"
         id="tspan41">Decrease political will by the economic value of each </tspan><tspan
         x="101.01562"
         y="1005.348"
         id="tspan42">sabotaged strategic center (factories, police stations, and </tspan><tspan
         x="101.01562"
         y="1042.0146"
         id="tspan43">artillery) and each sabotaged LOC.
</tspan><tspan
         x="101.01562"
         y="1078.6812"
         id="tspan44">
</tspan><tspan
         x="101.01562"
         y="1115.3479"
         id="tspan46"><tspan
   style="font-weight:bold"
   id="tspan45">Emergency Zones</tspan>
</tspan><tspan
         x="101.01562"
         y="1152.0145"
         id="tspan47">In each emergency zone, if no Rat pieces remain, remove </tspan><tspan
         x="101.01562"
         y="1188.6811"
         id="tspan48">the emergency zone. Then, political will decreases by one </tspan><tspan
         x="101.01562"
         y="1225.3477"
         id="tspan49">point for each emergency zone still on the map.
</tspan><tspan
         x="101.01562"
         y="1262.0144"
         id="tspan50">
</tspan><tspan
         x="101.01562"
         y="1298.681"
         id="tspan52"><tspan
   style="font-weight:bold"
   id="tspan51">Population</tspan>
</tspan><tspan
         x="101.01562"
         y="1335.3476"
         id="tspan53">In each space, if civilians are lower than the population, </tspan><tspan
         x="101.01562"
         y="1372.0143"
         id="tspan54">add one. Likewise, if gangsters are lower than gangster </tspan><tspan
         x="101.01562"
         y="1408.6809"
         id="tspan55">population, add one.
</tspan><tspan
         x="101.01562"
         y="1445.3475"
         id="tspan56">
</tspan><tspan
         x="101.01562"
         y="1482.0141"
         id="tspan58"><tspan
   style="font-weight:bold"
   id="tspan57">Reset</tspan>
</tspan><tspan
         x="101.01562"
         y="1518.6808"
         id="tspan59">Flip all guerrillas underground.
</tspan><tspan
         x="101.01562"
         y="1555.3474"
         id="tspan60">Remove all sabotage and terror from the map.
</tspan><tspan
         x="101.01562"
         y="1592.014"
         id="tspan61">
</tspan><tspan
         x="101.01562"
         y="1628.6806"
         id="tspan63"><tspan
   style="font-weight:bold"
   id="tspan62">Last round, game end</tspan>
</tspan><tspan
         x="101.01562"
         y="1665.3473"
         id="tspan64">If this is the last propaganda round, the game ends here.
</tspan><tspan
         x="101.01562"
         y="1702.0139"
         id="tspan65">If political will is reduced to 0, the rats win.
</tspan><tspan
         x="101.01562"
         y="1738.6805"
         id="tspan66">
</tspan></text>
