  <g
     inkscape:label="Layer 1"
     inkscape:groupmode="layer"
     id="layer1">
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="244.38086"
         y="61.023438"
         id="tspan3"><tspan
           style="font-weight:bold"
           id="tspan2">PROPAGANA ROUND</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(0,-39.743506)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan4">All armored cars move.
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan5">
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan7"><tspan
   style="font-weight:bold"
   id="tspan6">Shootouts</tspan>
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan8">In every space with gangsters or terror, roll a dice. If equal </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan9">or under power, trigger a shootout.
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan10">
</tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan12"><tspan
   style="font-weight:bold"
   id="tspan11">Bombing</tspan>
</tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan13">Rats may perform one free bombing (attack option B).
</tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan15">
</tspan><tspan
         x="101.01562"
         y="492.01523"
         id="tspan18"><tspan
   style="font-weight:bold"
   id="tspan17">Politicians</tspan>
</tspan><tspan
         x="101.01562"
         y="528.68185"
         id="tspan19">Political will increases by one for every surviving active </tspan><tspan
         x="101.01562"
         y="565.34848"
         id="tspan20">politician on the map. Then, in each space with an active </tspan><tspan
         x="101.01562"
         y="602.01511"
         id="tspan22">politician, government may replace one gang member with </tspan><tspan
         x="101.01562"
         y="638.68173"
         id="tspan23">a civilian, or place a civilian.
</tspan><tspan
         x="101.01562"
         y="675.34836"
         id="tspan24">Then, flip all politicians active.
</tspan><tspan
         x="101.01562"
         y="712.01498"
         id="tspan26">
</tspan><tspan
         x="101.01562"
         y="748.68161"
         id="tspan28"><tspan
           style="font-weight:bold"
           id="tspan27">Score Support
</tspan></tspan><tspan
         x="101.01562"
         y="785.34824"
         id="tspan29">Shift political will by the support track value.
</tspan><tspan
         x="101.01562"
         y="822.01486"
         id="tspan30">
</tspan><tspan
         x="101.01562"
         y="858.68149"
         id="tspan32"><tspan
   style="font-weight:bold"
   id="tspan31">Score population</tspan>
</tspan><tspan
         x="101.01562"
         y="895.34811"
         id="tspan34">For each district, compare the number of civilians to </tspan><tspan
         x="101.01562"
         y="932.01474"
         id="tspan35">gangsters. If there are more civilians than gangsters, gain </tspan><tspan
         x="101.01562"
         y="968.68137"
         id="tspan36">1 political will.  If there are more gangsters than civilians, </tspan><tspan
         x="101.01562"
         y="1005.348"
         id="tspan37">lose 1 political will. 
</tspan><tspan
         x="101.01562"
         y="1042.0146"
         id="tspan38">
</tspan><tspan
         x="101.01562"
         y="1078.6812"
         id="tspan41"><tspan
   style="font-weight:bold"
   id="tspan40">Score sabotage</tspan>
</tspan><tspan
         x="101.01562"
         y="1115.3479"
         id="tspan42">Decrease political will by the economic value of each </tspan><tspan
         x="101.01562"
         y="1152.0145"
         id="tspan43">sabotaged strategic center (factories, police stations, and </tspan><tspan
         x="101.01562"
         y="1188.6811"
         id="tspan44">artillery) and each sabotaged LOC.
</tspan><tspan
         x="101.01562"
         y="1225.3477"
         id="tspan46">
</tspan><tspan
         x="101.01562"
         y="1262.0144"
         id="tspan48"><tspan
   style="font-weight:bold"
   id="tspan47">Emergency Zones</tspan>
</tspan><tspan
         x="101.01562"
         y="1298.681"
         id="tspan49">In each emergency zone, if no Rat pieces remain, remove </tspan><tspan
         x="101.01562"
         y="1335.3476"
         id="tspan50">the emergency zone. Then, political will decreases by one </tspan><tspan
         x="101.01562"
         y="1372.0143"
         id="tspan52">point for each emergency zone still on the map.
</tspan><tspan
         x="101.01562"
         y="1408.6809"
         id="tspan53">
</tspan><tspan
         x="101.01562"
         y="1445.3475"
         id="tspan55"><tspan
   style="font-weight:bold"
   id="tspan54">Population</tspan>
</tspan><tspan
         x="101.01562"
         y="1482.0141"
         id="tspan56">In each space, if civilians are lower than the population, </tspan><tspan
         x="101.01562"
         y="1518.6808"
         id="tspan58">add one. Likewise, if gangsters are lower than gangster </tspan><tspan
         x="101.01562"
         y="1555.3474"
         id="tspan59">population, add one.
</tspan><tspan
         x="101.01562"
         y="1592.014"
         id="tspan60">
</tspan><tspan
         x="101.01562"
         y="1628.6806"
         id="tspan63"><tspan
   style="font-weight:bold"
   id="tspan61">Reset</tspan>
</tspan><tspan
         x="101.01562"
         y="1665.3473"
         id="tspan64">Flip all guerrillas underground. Remove all sabotage, terror, </tspan><tspan
         x="101.01562"
         y="1702.0139"
         id="tspan65">and emergency zones. from the map.
</tspan><tspan
         x="101.01562"
         y="1738.6805"
         id="tspan66">Shift the moss track down 1 space. Shift the support track </tspan><tspan
         x="101.01562"
         y="1775.3471"
         id="tspan67">1 space towards 0.
</tspan><tspan
         x="101.01562"
         y="1812.0138"
         id="tspan68">
</tspan><tspan
         x="101.01562"
         y="1848.6804"
         id="tspan70"><tspan
   style="font-weight:bold"
   id="tspan69">Last round, game end</tspan>
</tspan><tspan
         x="101.01562"
         y="1885.347"
         id="tspan71">If this is the last propaganda round, the game ends here.
</tspan><tspan
         x="101.01562"
         y="1922.0136"
         id="tspan72">If political will is reduced to 0, the rats win.
</tspan><tspan
         x="101.01562"
         y="1958.6803"
         id="tspan73">
</tspan></text>
