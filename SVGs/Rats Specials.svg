   id="tspan99">Kill</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan102"><tspan
   style="font-weight:bold"
   id="tspan101">Location</tspan>: One space with rat control and an underground </tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan103">cell.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan105"><tspan
   style="font-weight:bold"
   id="tspan104">Procedure</tspan>: In this space, reveal one underground Rat cell </tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan106">and remove one government piece (police before </tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan107">underground politicians, both to out of play).</tspan></text>
