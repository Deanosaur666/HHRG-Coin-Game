       x="-440.01428"
       y="0"
       transform="translate(0,28.426408)"><tspan
         x="99.986328"
         y="505.9531"
         id="tspan51"><tspan
   style="font-weight:bold"
   id="tspan50">Raid</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan53"><tspan
   style="font-weight:bold"
   id="tspan52">Purpose</tspan>: Move cells and flip them underground.
</tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan55"><tspan
   style="font-weight:bold"
   id="tspan54">Location</tspan>: Spaces adjacent to an arms cache, up to the </tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan56">arms cache value on the moss track.
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan58"><tspan
   style="font-weight:bold"
   id="tspan57">Procedure</tspan>: Pick either:
</tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan59">* Move 1 or 2 cells from an adjacent space with an arms </tspan><tspan
         x="99.986328"
         y="725.95285"
         id="tspan60">cache to the selected space, and then may perform a </tspan><tspan
         x="99.986328"
         y="762.61948"
         id="tspan61">single sabotage in the destination space.
</tspan><tspan
         x="99.986328"
         y="799.2861"
         id="tspan62">* Move 1 or 2 cells from the selected space to an adjacent </tspan><tspan
         x="99.986328"
         y="835.95273"
         id="tspan63">space with an arms cache, and flip them underground.</tspan></text>
