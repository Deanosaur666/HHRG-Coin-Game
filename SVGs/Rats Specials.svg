         y="934.61972"
         id="tspan79"><tspan
   style="font-weight:bold"
   id="tspan78">Purpose</tspan>: Move police cubes.
</tspan><tspan
         x="99.986328"
         y="971.28635"
         id="tspan81"><tspan
   style="font-weight:bold"
   id="tspan80">Location</tspan>: One space with underground Rat cells.
</tspan><tspan
         x="99.986328"
         y="1007.953"
         id="tspan83"><tspan
   style="font-weight:bold"
   id="tspan82">Procedure</tspan>: Move police cubes, up to the number of </tspan><tspan
         x="99.986328"
         y="1044.6196"
         id="tspan84">underground cells in that space, from the target space or </tspan><tspan
         x="99.986328"
         y="1081.2862"
         id="tspan85">an adjacent LOC to any adjacent spaces.</tspan></text>
