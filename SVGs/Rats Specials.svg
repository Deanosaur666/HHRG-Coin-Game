       y="0"
       transform="translate(0,836.0042)"><tspan
         x="99.986328"
         y="505.9531"
         id="tspan60"><tspan
   style="font-weight:bold"
   id="tspan59">Hide</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan62"><tspan
   style="font-weight:bold"
   id="tspan61">Location</tspan>: Any districts, up to the arms cache value on the </tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan63">moss track.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan66"><tspan
   style="font-weight:bold"
   id="tspan65">Procedure</tspan>: In each space, flip one active rat underground.</tspan></text>
