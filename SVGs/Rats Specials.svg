       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan73"><tspan
   style="font-weight:bold"
   id="tspan72">Traffic</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan75"><tspan
   style="font-weight:bold"
   id="tspan74">Purpose</tspan>: Increase moss track and move an arms cache.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan77"><tspan
   style="font-weight:bold"
   id="tspan76">Location</tspan>: Moss track, or a district with an underground </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan78">rat.
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan80"><tspan
   style="font-weight:bold"
   id="tspan79">Procedure</tspan>: If the moss grower is on the map, increase the </tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan81">moss track by one. Otherwise, place the moss grower in a </tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan82">district with an underground rat. Then, may move one </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan83">arms cache from any space to an adjacent district.</tspan></text>
