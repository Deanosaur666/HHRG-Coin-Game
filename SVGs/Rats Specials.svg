         x="99.986328"
         y="505.9531"
         id="tspan65"><tspan
   style="font-weight:bold"
   id="tspan64">Uprising</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan67"><tspan
   style="font-weight:bold"
   id="tspan66">Location</tspan>: Spaces with gangsters and no active politician, </tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan68">emergency zone, or support, up to the moss track value.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan70"><tspan
   style="font-weight:bold"
   id="tspan69">Procedure</tspan>: In each selected space, replace a gangster </tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan71">with an underground rat.</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#f8dfde;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
