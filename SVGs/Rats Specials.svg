       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan50"><tspan
   style="font-weight:bold"
   id="tspan49">Traffic</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan52"><tspan
   style="font-weight:bold"
   id="tspan51">Purpose</tspan>: Increase moss track and move an arms cache.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan54"><tspan
   style="font-weight:bold"
   id="tspan53">Location</tspan>: Moss track, or a district with an underground </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan55">rat.
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan57"><tspan
   style="font-weight:bold"
   id="tspan56">Procedure</tspan>: If the moss grower is on the map, increase the </tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan58">moss track by one. Otherwise, place the moss grower in a </tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan59">district with an underground rat. Then, may move one </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan60">arms cache from any space to an adjacent district.</tspan></text>
