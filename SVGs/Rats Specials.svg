         x="99.986328"
         y="505.9531"
         id="tspan64"><tspan
   style="font-weight:bold"
   id="tspan63">Raid</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan66"><tspan
   style="font-weight:bold"
   id="tspan65">Purpose</tspan>: Move cells and flip them underground.
</tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan68"><tspan
   style="font-weight:bold"
   id="tspan67">Location</tspan>: One space adjacent to an arms cache.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan70"><tspan
   style="font-weight:bold"
   id="tspan69">Procedure</tspan>: Pick either:
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan71">* Move 1 or 2 cells from an adjacent space with an arms </tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan72">cache to the selected space, and then perform a single </tspan><tspan
         x="99.986328"
         y="725.95285"
         id="tspan73">attack or sabotage in the destination space.
</tspan><tspan
         x="99.986328"
         y="762.61948"
         id="tspan74">* Move 1 or 2 cells from the selected space to an adjacent </tspan><tspan
         x="99.986328"
         y="799.2861"
         id="tspan75">space with an arms cache, and flip them underground.</tspan></text>
