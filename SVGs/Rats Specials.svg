       x="-440.01428"
       y="0"
       transform="translate(0,465.48024)"><tspan
         x="99.986328"
         y="505.9531"
         id="tspan49"><tspan
   style="font-weight:bold"
   id="tspan48">Smuggle</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan51"><tspan
   style="font-weight:bold"
   id="tspan50">Location</tspan>: A district adjacent to the moss grower, without </tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan52">support or an emergency zone.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan54"><tspan
   style="font-weight:bold"
   id="tspan53">Procedure</tspan>: Either:
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan55">* Place an arms cache and a gangster in the selected </tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan56">space.
</tspan><tspan
         x="99.986328"
         y="725.95285"
         id="tspan57">* Move the moss grower to the selected space. May also </tspan><tspan
         x="99.986328"
         y="762.61948"
         id="tspan58">move a rat cell from the grower's original space.</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#f8dfde;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
