           y="1731.9531"
           id="tspan39"><tspan
   style="font-weight:bold"
   id="tspan38">Assassination</tspan>
</tspan><tspan
           x="99.986328"
           y="1768.6197"
           id="tspan40">When a politician is removed by a Rat attack, decrease </tspan><tspan
           x="99.986328"
           y="1805.2863"
           id="tspan41">political will by 3, the support track shifts to the left, and an </tspan><tspan
           x="99.986328"
           y="1841.953"
           id="tspan44">emergency zone is placed in the space. Politicians are </tspan><tspan
           x="99.986328"
           y="1878.6196"
           id="tspan45">removed to out of play and cannot be returned to available </tspan><tspan
           x="99.986328"
           y="1915.2862"
           id="tspan46">from there.</tspan></text>
