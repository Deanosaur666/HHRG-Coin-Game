         y="1494.6197"
         id="tspan19"><tspan
   style="font-weight:bold"
   id="tspan16">Procedure</tspan>: Perform the <tspan
   style="font-style:italic"
   id="tspan17">traffic</tspan> special activity.</tspan></text>
    <rect
