    <text
       xml:space="preserve"
       id="text3"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect3);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,343.70563)"><tspan
         x="99.986328"
         y="1731.9531"
         id="tspan24"><tspan
   style="font-weight:bold"
   id="tspan23">Assassination</tspan>
</tspan><tspan
         x="99.986328"
         y="1768.6197"
         id="tspan25">When a politician is removed by a Rat attack, decrease </tspan><tspan
         x="99.986328"
         y="1805.2863"
         id="tspan26">political will by 3, the support track shifts to the left, and an </tspan><tspan
         x="99.986328"
         y="1841.953"
         id="tspan28">emergency zone is placed in the space (remaining </tspan><tspan
         x="99.986328"
         y="1878.6196"
         id="tspan29">politicians are flipped underground). Politicians are </tspan><tspan
         x="99.986328"
         y="1915.2862"
         id="tspan30">removed to out of play.</tspan></text>
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="173.27148"
         y="61.023438"
         id="tspan32"><tspan
           style="font-weight:bold"
           id="tspan31">RATS SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan34"><tspan
   style="font-weight:bold"
   id="tspan33">Traffic</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan36"><tspan
   style="font-weight:bold"
   id="tspan35">Purpose</tspan>: Increase moss track and move an arms cache.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan38"><tspan
   style="font-weight:bold"
   id="tspan37">Location</tspan>: Moss track, or a district with an underground </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan39">rat.
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan41"><tspan
   style="font-weight:bold"
   id="tspan40">Procedure</tspan>: If the moss grower is on the map, increase the </tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan42">moss track by one. Otherwise, place the moss grower in a </tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan44">district with an underground rat <tspan
   style="font-style:italic"
   id="tspan43">and no support</tspan>. Then, may </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan45">move one arms cache from any space to an adjacent </tspan><tspan
         x="101.01562"
         y="476.52927"
         id="tspan47"><tspan
           dx="0 18.61977 8.1497307 15.282536 11.501286 12.059883 8.1497345 16.127586 11.501289"
           id="tspan46">district.</tspan></tspan></text>
