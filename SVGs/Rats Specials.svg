</tspan></tspan><tspan
         x="99.986328"
         y="1296.6197"
         id="tspan13"><tspan
           style="font-weight:bold;fill:#000000;stroke:none"
           id="tspan10">Procedure</tspan><tspan
           style="fill:#000000;stroke:none"
           id="tspan12">: Flip one actuve rat underground. </tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text30"
