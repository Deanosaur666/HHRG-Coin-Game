         x="99.986328"
         y="1731.9531"
         id="tspan7"><tspan
   style="font-weight:bold"
   id="tspan6">Assassination</tspan>
</tspan><tspan
         x="99.986328"
         y="1768.6197"
         id="tspan8">When a politician is removed by a Rat attack, decrease </tspan><tspan
         x="99.986328"
         y="1805.2863"
         id="tspan9">political will by 2 and an emergency zone is placed in the </tspan><tspan
         x="99.986328"
         y="1841.953"
         id="tspan12">space (remaining politicians are flipped underground). Set </tspan><tspan
         x="99.986328"
         y="1878.6196"
         id="tspan13">the space to neutral. Politicians are removed to out of play.</tspan></text>
    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="173.27148"
         y="61.023438"
         id="tspan15"><tspan
           style="font-weight:bold"
           id="tspan14">RATS SPECIAL ACTIVITIES</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan17"><tspan
   style="font-weight:bold"
   id="tspan16">Traffic</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan20"><tspan
   style="font-weight:bold"
   id="tspan19">Purpose</tspan>: Increase moss track and move an arms cache.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan22"><tspan
   style="font-weight:bold"
   id="tspan21">Location</tspan>: Moss track, or a district with an underground </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan23">rat.
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan25"><tspan
   style="font-weight:bold"
   id="tspan24">Procedure</tspan>: If the moss grower is on the map, increase the </tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan26">moss track by one. Otherwise, place the moss grower in a </tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan28">district with an underground rat <tspan
   style="font-style:italic"
   id="tspan27">and no support</tspan>. Then, may </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan29">move one arms cache from any space to an adjacent </tspan><tspan
         x="101.01562"
         y="476.52927"
         id="tspan31"><tspan
           dx="0 18.61977 8.1497307 15.282536 11.501286 12.059883 8.1497345 16.127586 11.501289"
           id="tspan30">district.</tspan></tspan></text>
