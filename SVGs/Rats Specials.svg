    <text
       xml:space="preserve"
       id="text10"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect10);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,28.426408)"><tspan
         x="99.986328"
         y="505.9531"
         id="tspan35"><tspan
   style="font-weight:bold"
   id="tspan34">Raid</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan37"><tspan
   style="font-weight:bold"
   id="tspan36">Purpose</tspan>: Move cells and flip them underground.
</tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan39"><tspan
   style="font-weight:bold"
   id="tspan38">Location</tspan>: Spaces adjacent to an arms cache, up to the </tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan40">arms cache value on the moss track.
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan42"><tspan
   style="font-weight:bold"
   id="tspan41">Procedure</tspan>: Pick either:
</tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan43">* Move 1 or 2 cells from an adjacent space with an arms </tspan><tspan
         x="99.986328"
         y="725.95285"
         id="tspan44">cache to the selected space, and then may perform a </tspan><tspan
         x="99.986328"
         y="762.61948"
         id="tspan45">single sabotage in the destination space.
</tspan><tspan
         x="99.986328"
         y="799.2861"
         id="tspan46">* Move 1 or 2 cells from the selected space to an adjacent </tspan><tspan
         x="99.986328"
         y="835.95273"
         id="tspan47">space with an arms cache, and flip them underground.</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#f8dfde;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
