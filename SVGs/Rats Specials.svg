</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan75"><tspan
   style="font-weight:bold"
   id="tspan74">Location</tspan>: A district adjacent to the moss grower, without </tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan76">support or an emergency zone.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan78"><tspan
   style="font-weight:bold"
   id="tspan77">Procedure</tspan>: Place an arms cache and a gangster in the </tspan><tspan
