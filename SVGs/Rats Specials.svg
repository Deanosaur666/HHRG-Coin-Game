         y="505.9531"
         id="tspan87"><tspan
   style="font-weight:bold"
   id="tspan86">Raid</tspan>
</tspan><tspan
         x="99.986328"
         y="542.61972"
         id="tspan89"><tspan
   style="font-weight:bold"
   id="tspan88">Purpose</tspan>: Move cells and flip them underground.
</tspan><tspan
         x="99.986328"
         y="579.28635"
         id="tspan91"><tspan
   style="font-weight:bold"
   id="tspan90">Location</tspan>: One space adjacent to an arms cache.
</tspan><tspan
         x="99.986328"
         y="615.95297"
         id="tspan93"><tspan
   style="font-weight:bold"
   id="tspan92">Procedure</tspan>: Pick either:
</tspan><tspan
         x="99.986328"
         y="652.6196"
         id="tspan94">* Move 1 or 2 cells from an adjacent space with an arms </tspan><tspan
         x="99.986328"
         y="689.28623"
         id="tspan95">cache to the selected space, and then may perform a </tspan><tspan
         x="99.986328"
         y="725.95285"
         id="tspan96">single sabotage in the destination space.
</tspan><tspan
         x="99.986328"
         y="762.61948"
         id="tspan97">* Move 1 or 2 cells from the selected space to an adjacent </tspan><tspan
         x="99.986328"
         y="799.2861"
         id="tspan98">space with an arms cache, and flip them underground.</tspan></text>
