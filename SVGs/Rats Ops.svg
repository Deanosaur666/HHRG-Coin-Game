    <text
       xml:space="preserve"
       id="text1"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect1);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-452.40509"
       y="0"
       transform="translate(0,127.82338)"><tspan
         x="99.986328"
         y="125.93942"
         id="tspan17"><tspan
   style="font-weight:bold"
   id="tspan16">Rally</tspan>
</tspan><tspan
         x="99.986328"
         y="162.60605"
         id="tspan25"><tspan
   style="font-weight:bold"
   id="tspan23">Location</tspan>: Foreign spaces and districts without support or </tspan><tspan
         x="99.986328"
         y="199.27268"
         id="tspan26">an emergency zone.
</tspan><tspan
         x="99.986328"
         y="235.9393"
         id="tspan28"><tspan
   style="font-weight:bold"
   id="tspan27">Procedure</tspan>: In each space place one cell, or, if the moss </tspan><tspan
         x="99.986328"
         y="272.60593"
         id="tspan29">grower is in that space, 3 cells and one gangster. Then, may </tspan><tspan
         x="99.986328"
         y="309.27255"
         id="tspan30">place arms caches in selected spaces, up to the arms cache </tspan><tspan
         x="99.986328"
         y="345.93918"
         id="tspan31">value on the moss track.
</tspan><tspan
         x="99.986328"
         y="382.60581"
         id="tspan36"><tspan
           style="font-style:italic"
           id="tspan35">Note: Rally may pull Rat cells from anywhere on the map if </tspan></tspan><tspan
         x="99.986328"
         y="419.27243"
         id="tspan39"><tspan
           style="font-style:italic"
           id="tspan38">none are available.
</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text7"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect7);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,160.14928)"><tspan
         x="99.986328"
         y="501.9531"
         id="tspan41"><tspan
   style="font-weight:bold"
   id="tspan40">March</tspan>
</tspan><tspan
         x="99.986328"
         y="538.61972"
         id="tspan43"><tspan
   style="font-weight:bold"
   id="tspan42">Location</tspan>: Any destination spaces.
</tspan><tspan
         x="99.986328"
         y="575.28635"
         id="tspan45"><tspan
   style="font-weight:bold"
   id="tspan44">Procedure</tspan>: Move Rat cells from adjacent spaces without </tspan><tspan
         x="99.986328"
         y="611.95297"
         id="tspan46">emergency zones. Rats may bring one gangster with them </tspan><tspan
         x="99.986328"
         y="648.6196"
         id="tspan47">if the origin space was not at support. Then:
</tspan><tspan
         x="99.986328"
         y="685.28623"
         id="tspan48">* If destination is an emergency zone, strategic center, or </tspan><tspan
         x="99.986328"
         y="721.95285"
         id="tspan49">LOC, and moving cells plus police and active politicians </tspan><tspan
         x="99.986328"
         y="758.61948"
         id="tspan50">there exceed 3, flip moving cells to active.
</tspan><tspan
         x="99.986328"
         y="795.2861"
         id="tspan51">* Otherwise, if the destination is at oppose, may flip </tspan><tspan
         x="99.986328"
         y="831.95273"
         id="tspan52">moving cells underground.
</tspan><tspan
         x="99.986328"
         y="868.61935"
         id="tspan54"><tspan
   style="font-style:italic"
   id="tspan53">Note: Movement may be chained.</tspan>
</tspan></text>
    <text
       xml:space="preserve"
       id="text12"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect12);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,483.22032)"><tspan
         x="99.986328"
         y="979.9531"
         id="tspan56"><tspan
   style="font-weight:bold"
   id="tspan55">Bombing</tspan>
</tspan><tspan
         x="99.986328"
         y="1016.6197"
         id="tspan58"><tspan
   style="font-weight:bold"
   id="tspan57">Location</tspan>: Any spaces with underground cells, adjacent or </tspan><tspan
         x="99.986328"
         y="1053.2863"
         id="tspan59">with arms caches
</tspan><tspan
         x="99.986328"
         y="1089.953"
         id="tspan61"><tspan
   style="font-weight:bold"
   id="tspan60">Procedure</tspan>: In each selected space, remove an arms cache </tspan><tspan
         x="99.986328"
         y="1126.6196"
         id="tspan62">from the space or an adjacent space, activate an </tspan><tspan
         x="99.986328"
         y="1163.2862"
         id="tspan63">underground cell, and roll a dice.
</tspan><tspan
         x="99.986328"
         y="1199.9529"
         id="tspan67">- Attack power is equal half dice roll, rounded up. (1-3). Add </tspan><tspan
         x="99.986328"
         y="1236.6195"
         id="tspan69">one for each arms cache used.  Each piece removed costs </tspan><tspan
         x="99.986328"
         y="1273.2861"
         id="tspan70">one attack power.
</tspan><tspan
         x="99.986328"
         y="1309.9527"
         id="tspan71">* First, remove police cubes (removed to out of play).
</tspan><tspan
         x="99.986328"
         y="1346.6194"
         id="tspan72">* Then, once no police, if there is an armored car, may </tspan><tspan
         x="99.986328"
         y="1383.286"
         id="tspan73">remove it. If an armored car is removed, reduce political </tspan><tspan
         x="99.986328"
         y="1419.9526"
         id="tspan74">will by 1, and may place an arms cache in a district </tspan><tspan
         x="99.986328"
         y="1456.6192"
         id="tspan75">adjacent to the car.
</tspan><tspan
         x="99.986328"
         y="1493.2859"
         id="tspan76">* Then, if power remains, remove the following pieces in </tspan><tspan
         x="99.986328"
         y="1529.9525"
         id="tspan77">alternating order: politician, civilian cube, gang cube. (See </tspan><tspan
         x="99.986328"
         y="1566.6191"
         id="tspan79"><tspan
   style="font-style:italic"
   id="tspan78">Assassination</tspan>). Removed civilians are placed in the rat's </tspan><tspan
         x="99.986328"
         y="1603.2857"
         id="tspan80">collateral box.
</tspan><tspan
         x="99.986328"
         y="1639.9524"
         id="tspan81">Then:
</tspan><tspan
         x="99.986328"
         y="1676.619"
         id="tspan83">* If space is an LOC, place a sabotage <tspan
   style="font-style:italic"
   id="tspan82">if none</tspan>.
</tspan><tspan
         x="99.986328"
         y="1713.2856"
         id="tspan85">* Otherwise, place a terror <tspan
   style="font-style:italic"
   id="tspan84">if none</tspan>.
</tspan><tspan
         x="99.986328"
         y="1749.9522"
         id="tspan86">* If there are any surviving active politicians in the space, </tspan><tspan
         x="99.986328"
         y="1786.6189"
         id="tspan87">flip them underground.
</tspan></text>
    <text
       xml:space="preserve"
       id="text17"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect17);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,-851.81924)"><tspan
         x="99.986328"
         y="2005.8515"
         id="tspan89"><tspan
   style="font-weight:bold"
   id="tspan88">Sabotage</tspan>
</tspan><tspan
         x="99.986328"
         y="2042.5182"
         id="tspan91"><tspan
   style="font-weight:bold"
   id="tspan90">Location</tspan>: Spaces with underground cells and no active </tspan><tspan
         x="99.986328"
         y="2079.1848"
         id="tspan92">politicians.
</tspan><tspan
         x="99.986328"
         y="2115.8515"
         id="tspan94"><tspan
   style="font-weight:bold"
   id="tspan93">Procedure</tspan>: In each space reveal one underground cell, </tspan><tspan
         x="99.986328"
         y="2152.518"
         id="tspan96">and then place a sabotage <tspan
   style="font-style:italic"
   id="tspan95">if none</tspan>. If the space is a district, </tspan><tspan
         x="99.986328"
         y="2189.1845"
         id="tspan97">shift it towards opposition.</tspan></text>
    <rect
       style="display:inline;vector-effect:non-scaling-stroke;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       id="rect13"
       width="929.5918"
       height="83.810959"
       x="75.204071"
       y="91.500374"
       rx="75.590553"
       ry="41.905479" />
    <text
       xml:space="preserve"
       id="text18"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect18);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-452.40509"
       y="0"
       transform="translate(0,17.514716)"><tspan
         x="99.986328"
         y="125.93942"
         id="tspan100"><tspan
   style="font-weight:bold"
   id="tspan98">Note:</tspan> <tspan
   style="font-size:26.6667px"
   id="tspan99">All rat ops are limited by the ops value of the moss track.</tspan></tspan></text>
  </g>
