    <text
       xml:space="preserve"
       id="text1"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect1);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-452.40509"
       y="0"
       transform="translate(0,26.000001)"><tspan
         x="99.986328"
         y="125.93942"
         id="tspan10"><tspan
   style="font-weight:bold"
   id="tspan9">Rally</tspan>
</tspan><tspan
         x="99.986328"
         y="162.60605"
         id="tspan12"><tspan
   style="font-weight:bold"
   id="tspan11">Location</tspan>: Foreign spaces and any districts without </tspan><tspan
         x="99.986328"
         y="199.27268"
         id="tspan13">government control or emergency zones.
</tspan><tspan
         x="99.986328"
         y="235.9393"
         id="tspan15"><tspan
   style="font-weight:bold"
   id="tspan14">Procedure</tspan>: In each space place one cell, or, if there is an </tspan><tspan
         x="99.986328"
         y="272.60593"
         id="tspan16">arms cache in the space, two cells. If the support track </tspan><tspan
         x="99.986328"
         y="309.27255"
         id="tspan17">allows it, may then replace one gang cube with a Rats cell. </tspan><tspan
         x="99.986328"
         y="345.93918"
         id="tspan18">Then, may place arms caches in selected space, up to the </tspan><tspan
         x="99.986328"
         y="382.60581"
         id="tspan19">arms cache value on the moss track.
</tspan></text>
    <text
       xml:space="preserve"
       id="text7"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect7);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,58.325903)"><tspan
         x="99.986328"
         y="501.9531"
         id="tspan21"><tspan
   style="font-weight:bold"
   id="tspan20">Travel</tspan>
</tspan><tspan
         x="99.986328"
         y="538.61972"
         id="tspan23"><tspan
   style="font-weight:bold"
   id="tspan22">Location</tspan>: Any origin spaces without emergency zones
</tspan><tspan
         x="99.986328"
         y="575.28635"
         id="tspan25"><tspan
   style="font-weight:bold"
   id="tspan24">Procedure</tspan>: Move Rat cells from origin spaces to adjacent </tspan><tspan
         x="99.986328"
         y="611.95297"
         id="tspan26">spaces. Then:
</tspan><tspan
         x="99.986328"
         y="648.6196"
         id="tspan27">* If destination is an emergency zone, strategic center, or </tspan><tspan
         x="99.986328"
         y="685.28623"
         id="tspan28">LOC, and moving cells plus cubes there exceed 3, flip </tspan><tspan
         x="99.986328"
         y="721.95285"
         id="tspan29">moving cells to active.
</tspan><tspan
         x="99.986328"
         y="758.61948"
         id="tspan30">* Otherwise, flip moving cells underground.
</tspan><tspan
         x="99.986328"
         y="795.2861"
         id="tspan31">*Note: Movement may be chained.*
</tspan></text>
    <text
       xml:space="preserve"
       id="text12"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect12);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,321.99997)"><tspan
         x="99.986328"
         y="979.9531"
         id="tspan33"><tspan
   style="font-weight:bold"
   id="tspan32">Bombing</tspan>
</tspan><tspan
         x="99.986328"
         y="1016.6197"
         id="tspan35"><tspan
   style="font-weight:bold"
   id="tspan34">Location</tspan>: Any spaces with underground cells, adjacent or </tspan><tspan
         x="99.986328"
         y="1053.2863"
         id="tspan36">with arms caches
</tspan><tspan
         x="99.986328"
         y="1089.953"
         id="tspan38"><tspan
   style="font-weight:bold"
   id="tspan37">Procedure</tspan>: Select a number of space at or adjacent to </tspan><tspan
         x="99.986328"
         y="1126.6196"
         id="tspan40">arms caches. <tspan
   style="font-style:italic"
   id="tspan39">All spaces must be selected first, and then all </tspan></tspan><tspan
         x="99.986328"
         y="1163.2862"
         id="tspan42"><tspan
   style="font-style:italic"
   id="tspan41">spaces must be resolved.</tspan> Remove used arms caches, then, </tspan><tspan
         x="99.986328"
         y="1199.9529"
         id="tspan43">in each selected space, activate an underground cell, and </tspan><tspan
         x="99.986328"
         y="1236.6195"
         id="tspan44">roll a dice.
</tspan><tspan
         x="99.986328"
         y="1273.2861"
         id="tspan45">- Attack power is equal half dice roll, rounded up. (1-3). Add </tspan><tspan
         x="99.986328"
         y="1309.9527"
         id="tspan46">one for each arms cache used. Remove pieces up to attack </tspan><tspan
         x="99.986328"
         y="1346.6194"
         id="tspan47">power.
</tspan><tspan
         x="99.986328"
         y="1383.286"
         id="tspan48">* First, remove police cubes (removed to out of play).
</tspan><tspan
         x="99.986328"
         y="1419.9526"
         id="tspan49">* Then, once no police, may remove an armored car, to </tspan><tspan
         x="99.986328"
         y="1456.6192"
         id="tspan50">reduce political will by 1, and then may place an arms </tspan><tspan
         x="99.986328"
         y="1493.2859"
         id="tspan51">cache in a district adjacent to the car.
</tspan><tspan
         x="99.986328"
         y="1529.9525"
         id="tspan52">* Then, if power remains, remove the following pieces in </tspan><tspan
         x="99.986328"
         y="1566.6191"
         id="tspan53">alternating order: politician, civilian cube, gang cube. (See </tspan><tspan
         x="99.986328"
         y="1603.2857"
         id="tspan54">Assassination). Removed civilians are placed in the rat's </tspan><tspan
         x="99.986328"
         y="1639.9524"
         id="tspan56">collateral box.
</tspan><tspan
         x="99.986328"
         y="1676.619"
         id="tspan57">Then:
</tspan><tspan
         x="99.986328"
         y="1713.2856"
         id="tspan58">* If space is an LOC, place a sabotage.
</tspan><tspan
         x="99.986328"
         y="1749.9522"
         id="tspan60">* Otherwise, place a terror.
</tspan><tspan
         x="99.986328"
         y="1786.6189"
         id="tspan62">* If there are any surviving active politicians in the space, </tspan><tspan
         x="99.986328"
         y="1823.2855"
         id="tspan63">flip them underground.</tspan></text>
    <text
       xml:space="preserve"
       id="text17"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect17);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,-1006.995)"><tspan
         x="99.986328"
         y="2005.8515"
         id="tspan65"><tspan
   style="font-weight:bold"
   id="tspan64">Sabotage</tspan>
</tspan><tspan
         x="99.986328"
         y="2042.5182"
         id="tspan67"><tspan
   style="font-weight:bold"
   id="tspan66">Location</tspan>: Any spaces with underground cells
</tspan><tspan
         x="99.986328"
         y="2079.1848"
         id="tspan69"><tspan
   style="font-weight:bold"
   id="tspan68">Procedure</tspan>: In each space reveal one underground cell, </tspan><tspan
         x="99.986328"
         y="2115.8515"
         id="tspan70">and then place a sabotage. If there are active politicians in </tspan><tspan
         x="99.986328"
         y="2152.518"
         id="tspan71">the space, flip them underground.</tspan></text>
  </g>
</svg>
