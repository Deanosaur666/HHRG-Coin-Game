       x="-440.01428"
       y="0"
       transform="translate(-12.658939,-1786.5732)"><tspan
         x="99.986328"
         y="1895.5429"
         id="tspan5"><tspan
           style="font-weight:bold"
           id="tspan4">Setup
</tspan></tspan><tspan
         x="99.986328"
         y="1932.2096"
         id="tspan7"><tspan
           style="font-weight:bold"
           id="tspan6">
</tspan></tspan><tspan
         x="99.986328"
         y="1968.8762"
         id="tspan9">Politcal will starts at 14<tspan
   style="font-weight:bold"
   id="tspan8">
</tspan></tspan><tspan
         x="99.986328"
         y="2005.5428"
         id="tspan11"><tspan
           style="font-weight:bold"
           id="tspan10">
</tspan></tspan><tspan
         x="99.986328"
         y="2042.2094"
         id="tspan13"><tspan
           style="font-weight:bold"
           id="tspan12">Government
</tspan></tspan><tspan
         x="99.986328"
         y="2078.8759"
         id="tspan15">-Place 2 police in each police station, 1 in each factory.<tspan
   style="font-weight:bold"
   id="tspan14">
</tspan></tspan><tspan
         x="99.986328"
         y="2115.5425"
         id="tspan16">-Place a politician, a police, and support in two non-</tspan><tspan
         x="99.986328"
         y="2152.209"
         id="tspan17">southern districts.
</tspan><tspan
         x="99.986328"
         y="2188.8755"
         id="tspan18">-Place 4 police in available, and 8 in out of play.
</tspan><tspan
         x="99.986328"
         y="2225.542"
         id="tspan19">
</tspan><tspan
         x="99.986328"
         y="2262.2085"
         id="tspan21"><tspan
   style="font-weight:bold"
   id="tspan20">Rats</tspan>
</tspan><tspan
         x="99.986328"
         y="2298.875"
         id="tspan22">-Each foreign space will have two rats, and one will have </tspan><tspan
         x="99.986328"
         y="2335.5415"
         id="tspan23">an arms cache.
</tspan><tspan
         x="99.986328"
         y="2372.208"
         id="tspan24">-One southern space will have the moss grower, and it will </tspan><tspan
         x="99.986328"
         y="2408.8745"
         id="tspan25">have 2 rats and opposition.
</tspan><tspan
         x="99.986328"
         y="2445.541"
         id="tspan26">-All other districts without politicians should have 1 rat in </tspan><tspan
         x="99.986328"
         y="2482.2075"
         id="tspan27">them.
</tspan><tspan
         x="99.986328"
         y="2518.874"
         id="tspan29"><tspan
   style="font-weight:bold"
   id="tspan28">Civilians</tspan>
</tspan><tspan
         x="99.986328"
         y="2555.5405"
         id="tspan30">-NC and CC districts should have one civilian and one </tspan><tspan
         x="99.986328"
         y="2592.207"
         id="tspan31">gangster.
</tspan><tspan
         x="99.986328"
         y="2628.8735"
         id="tspan32">-The moss grower space has two gangsters.
</tspan><tspan
         x="99.986328"
         y="2665.54"
         id="tspan33">-All other districts will have one civilian.</tspan></text>
