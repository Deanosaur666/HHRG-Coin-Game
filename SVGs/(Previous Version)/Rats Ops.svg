    <text
       xml:space="preserve"
       id="text1"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect1);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-452.40509"
       y="0"
       transform="translate(0,26.000001)"><tspan
         x="99.986328"
         y="125.93942"
         id="tspan13"><tspan
   style="font-weight:bold"
   id="tspan8">Rally</tspan>
</tspan><tspan
         x="99.986328"
         y="162.60605"
         id="tspan23"><tspan
   style="font-weight:bold"
   id="tspan18">Purpose</tspan>: Add Rat cells and arms caches to the map.
</tspan><tspan
         x="99.986328"
         y="199.27268"
         id="tspan25"><tspan
   style="font-weight:bold"
   id="tspan24">Location</tspan>: Any districts
</tspan><tspan
         x="99.986328"
         y="235.9393"
         id="tspan27"><tspan
   style="font-weight:bold"
   id="tspan26">Procedure</tspan>: In each space place one cell, or, if there is an </tspan><tspan
         x="99.986328"
         y="272.60593"
         id="tspan28">arms cache in the space, two cells. If the support track </tspan><tspan
         x="99.986328"
         y="309.27255"
         id="tspan29">allows it, may then replace one gang cube with a Rats cell. </tspan><tspan
         x="99.986328"
         y="345.93918"
         id="tspan30">Then, may place arms caches in selected space, up to the </tspan><tspan
         x="99.986328"
         y="382.60581"
         id="tspan31">arms cache value on the moss track.
</tspan></text>
    <text
       xml:space="preserve"
       id="text7"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect7);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,38.183767)"><tspan
         x="99.986328"
         y="501.9531"
         id="tspan33"><tspan
   style="font-weight:bold"
   id="tspan32">Travel</tspan>
</tspan><tspan
         x="99.986328"
         y="538.61972"
         id="tspan35"><tspan
   style="font-weight:bold"
   id="tspan34">Purpose</tspan>: Move Rat cells and flip them underground.
</tspan><tspan
         x="99.986328"
         y="575.28635"
         id="tspan37"><tspan
   style="font-weight:bold"
   id="tspan36">Location</tspan>: Any origin spaces without emergency zones
</tspan><tspan
         x="99.986328"
         y="611.95297"
         id="tspan39"><tspan
   style="font-weight:bold"
   id="tspan38">Procedure</tspan>: Move Rat cells from origin spaces to adjacent </tspan><tspan
         x="99.986328"
         y="648.6196"
         id="tspan40">spaces. Then:
</tspan><tspan
         x="99.986328"
         y="685.28623"
         id="tspan41">* If destination is an emergency zone, strategic center, or </tspan><tspan
         x="99.986328"
         y="721.95285"
         id="tspan42">LOC, and moving cells plus cubes there exceed 3, flip </tspan><tspan
         x="99.986328"
         y="758.61948"
         id="tspan43">moving cells to active.
</tspan><tspan
         x="99.986328"
         y="795.2861"
         id="tspan44">* Otherwise, flip moving cells underground.
</tspan><tspan
         x="99.986328"
         y="831.95273"
         id="tspan45">*Note: Movement may be chained.*
</tspan></text>
    <text
       xml:space="preserve"
       id="text12"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect12);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,28.000001)"><tspan
         x="99.986328"
         y="979.9531"
         id="tspan47"><tspan
   style="font-weight:bold"
   id="tspan46">Attack</tspan>
</tspan><tspan
         x="99.986328"
         y="1016.6197"
         id="tspan49"><tspan
   style="font-weight:bold"
   id="tspan48">Purpose</tspan>: Kill police, stop armored cars, and assassinate </tspan><tspan
         x="99.986328"
         y="1053.2863"
         id="tspan50">politicians.
</tspan><tspan
         x="99.986328"
         y="1089.953"
         id="tspan52"><tspan
   style="font-weight:bold"
   id="tspan51">Location</tspan>: Any spaces with underground cells
</tspan><tspan
         x="99.986328"
         y="1126.6196"
         id="tspan54"><tspan
   style="font-weight:bold"
   id="tspan53">Procedure</tspan>: At each space, reveal an underground cell and </tspan><tspan
         x="99.986328"
         y="1163.2862"
         id="tspan55">then either:
</tspan><tspan
         x="99.986328"
         y="1199.9529"
         id="tspan56">A: Remove (kill) a politician if there are no police in the </tspan><tspan
         x="99.986328"
         y="1236.6195"
         id="tspan57">space (see Assassination).
</tspan><tspan
         x="99.986328"
         y="1273.2861"
         id="tspan58">B: Bombing. Remove one or more arms caches in or </tspan><tspan
         x="99.986328"
         y="1309.9527"
         id="tspan59">adjacent to the space. Determine attack power by rolling a </tspan><tspan
         x="99.986328"
         y="1346.6194"
         id="tspan60">die and adding double the number of arms caches </tspan><tspan
         x="99.986328"
         y="1383.286"
         id="tspan61">removed. First, remove police cubes (each cube costs 2 </tspan><tspan
         x="99.986328"
         y="1419.9526"
         id="tspan62">power, removed to out of play). Then, once no police, if </tspan><tspan
         x="99.986328"
         y="1456.6192"
         id="tspan63">there is an armored car, may remove it for 2 power, and </tspan><tspan
         x="99.986328"
         y="1493.2859"
         id="tspan64">may place an arms cache in a district adjacent to the car. If </tspan><tspan
         x="99.986328"
         y="1529.9525"
         id="tspan65">power remains, remove the following pieces in alternating </tspan><tspan
         x="99.986328"
         y="1566.6191"
         id="tspan66">order: politician, civilian cube, gang cube. If any civilian </tspan><tspan
         x="99.986328"
         y="1603.2857"
         id="tspan67">cubes were removed, shift the support track to the right.
</tspan><tspan
         x="99.986328"
         y="1639.9524"
         id="tspan68">Then:
</tspan><tspan
         x="99.986328"
         y="1676.619"
         id="tspan69">* If space is an LOC, place a sabotage.
</tspan><tspan
         x="99.986328"
         y="1713.2856"
         id="tspan70">* Otherwise, place a terror.
</tspan><tspan
         x="99.986328"
         y="1749.9522"
         id="tspan71">* If there are any surviving active politicians in the space, </tspan><tspan
         x="99.986328"
         y="1786.6189"
         id="tspan72">flip them underground.</tspan></text>
    <text
       xml:space="preserve"
       id="text17"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect17);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,-30.99495)"><tspan
         x="99.986328"
         y="2005.8515"
         id="tspan74"><tspan
   style="font-weight:bold"
   id="tspan73">Sabotage</tspan>
</tspan><tspan
         x="99.986328"
         y="2042.5182"
         id="tspan76"><tspan
   style="font-weight:bold"
   id="tspan75">Purpose</tspan>: Sabotage spaces to limit police movement, </tspan><tspan
         x="99.986328"
         y="2079.1848"
         id="tspan77">income, and shift to resist.
</tspan><tspan
         x="99.986328"
         y="2115.8515"
         id="tspan79"><tspan
   style="font-weight:bold"
   id="tspan78">Location</tspan>: Any spaces with underground cells
</tspan><tspan
         x="99.986328"
         y="2152.518"
         id="tspan81"><tspan
   style="font-weight:bold"
   id="tspan80">Procedure</tspan>: In each space reveal one underground cell, </tspan><tspan
         x="99.986328"
         y="2189.1845"
         id="tspan82">and then place a sabotage. May replace a civilian with a </tspan><tspan
         x="99.986328"
         y="2225.851"
         id="tspan83">gang member in each target district. If the space is a </tspan><tspan
         x="99.986328"
         y="2262.5175"
         id="tspan84">strategic center, shift the support track to the left.</tspan></text>
  </g>
</svg>
