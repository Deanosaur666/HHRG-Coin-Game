         x="254.49414"
         y="61.023438"
         id="tspan11"><tspan
           style="font-weight:bold"
           id="tspan10">EVENTS and TURNS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(0,-39.743506)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan12">At the start of each turn, roll a dice.
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan13">
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan14">If a propaganda round is triggered, ignore the event effect, </tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan15">otherwise, the initiative player triggers the following event:
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan16">
</tspan><tspan
         x="101.01562"
         y="352.42685"
         id="tspan18"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan17">1</tspan>: No effect
</tspan><tspan
         x="101.01562"
         y="392.01535"
         id="tspan19">
</tspan><tspan
         x="101.01562"
         y="435.7601"
         id="tspan21"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan20">2</tspan>: Government player moves an additional armored car
</tspan><tspan
         x="101.01562"
         y="475.3486"
         id="tspan22">
</tspan><tspan
         x="101.01562"
         y="519.09336"
         id="tspan24"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan23">3</tspan>: Government player moves two additional armored cars.
</tspan><tspan
         x="101.01562"
         y="558.68185"
         id="tspan25">
</tspan><tspan
         x="101.01562"
         y="602.42661"
         id="tspan27"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan26">4</tspan>: Initiative player places 2 civilians among 1 or 2 district </tspan><tspan
         x="101.01562"
         y="642.01511"
         id="tspan28">spaces without terror or an emergency zone.
</tspan><tspan
         x="101.01562"
         y="678.68173"
         id="tspan29">
</tspan><tspan
         x="101.01562"
         y="722.42649"
         id="tspan31"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan30">5</tspan>: Initiative player places 2 gang members among 1 or 2 </tspan><tspan
         x="101.01562"
         y="762.01498"
         id="tspan32">district spaces without an emergency zone.
</tspan><tspan
         x="101.01562"
         y="798.68161"
         id="tspan33">
</tspan><tspan
         x="101.01562"
         y="842.42636"
         id="tspan35"><tspan
   style="font-weight:bold;font-size:37.3333px"
   id="tspan34">6</tspan>: Initiative player triggers a shootout in a space with </tspan><tspan
         x="101.01562"
         y="882.01486"
         id="tspan36">terror.
</tspan><tspan
         x="101.01562"
         y="918.68149"
         id="tspan37">
</tspan><tspan
         x="101.01562"
         y="955.34811"
         id="tspan38">
</tspan><tspan
         x="101.01562"
         y="992.01474"
         id="tspan39">
</tspan><tspan
         x="101.01562"
         y="1028.6814"
         id="tspan41"><tspan
   style="font-weight:bold"
   id="tspan40">Armored Car Movement</tspan>
</tspan><tspan
         x="101.01562"
         y="1065.348"
         id="tspan42">
</tspan><tspan
         x="101.01562"
         y="1102.0146"
         id="tspan43">After resolving an event, the government player may move </tspan><tspan
         x="101.01562"
         y="1138.6812"
         id="tspan44">an armored car (or more if a 2 or 3 are rolled) down an un-</tspan><tspan
         x="101.01562"
         y="1175.3479"
         id="tspan45">sabotaged LOC. If an armored car reaches a police station, </tspan><tspan
         x="101.01562"
         y="1212.0145"
         id="tspan46">it is removed to available, and the government moves 2 </tspan><tspan
         x="101.01562"
         y="1248.6811"
         id="tspan47">police from out of play to available.
</tspan><tspan
         x="101.01562"
         y="1285.3477"
         id="tspan48">
</tspan><tspan
         x="101.01562"
         y="1322.0144"
         id="tspan49">
</tspan><tspan
         x="101.01562"
         y="1358.681"
         id="tspan50">
</tspan><tspan
         x="101.01562"
         y="1395.3476"
         id="tspan51">
</tspan></text>
