    <text
       xml:space="preserve"
       id="text9"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect9);display:inline;vector-effect:non-scaling-stroke;fill:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,-101.62881)"><tspan
         x="99.986328"
         y="1895.5429"
         id="tspan53"><tspan
   style="font-weight:bold"
   id="tspan52">Shootouts</tspan>
</tspan><tspan
         x="99.986328"
         y="1932.2096"
         id="tspan54">In shootout spaces:
</tspan><tspan
         x="99.986328"
         y="1968.8762"
         id="tspan55">Shootout &quot;power&quot; is gangsters + terror markers.
</tspan><tspan
         x="99.986328"
         y="2005.5428"
         id="tspan56">
</tspan><tspan
         x="99.986328"
         y="2042.2094"
         id="tspan57">Remove pieces equal to power, in alternating order:
</tspan><tspan
         x="99.986328"
         y="2078.8759"
         id="tspan58">- Civilian (or gangster if no civilians left)
</tspan><tspan
         x="99.986328"
         y="2115.5425"
         id="tspan59">- Active rat (or reveal underground rat if none active)
</tspan><tspan
         x="99.986328"
         y="2152.209"
         id="tspan60">
</tspan><tspan
         x="99.986328"
         y="2188.8755"
         id="tspan61">Any active politicians in the space are flipped underground.
</tspan><tspan
         x="99.986328"
         y="2225.542"
         id="tspan62">
</tspan><tspan
         x="99.986328"
         y="2262.2085"
         id="tspan63">After a shootout takes place, rats may take an attack action </tspan><tspan
         x="99.986328"
         y="2298.875"
         id="tspan64">in that space, then police may assault in that space.</tspan></text>
  </g>
