    </g>
    <text
       xml:space="preserve"
       id="text25"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:32px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect26);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,278.135)"><tspan
         x="99.986328"
         y="469.48633"
         id="tspan27"><tspan
   style="font-weight:bold"
   id="tspan26">Sweep</tspan>
</tspan><tspan
         x="99.986328"
         y="509.48633"
         id="tspan29"><tspan
   style="font-weight:bold"
   id="tspan28">Location</tspan>: Any destination spaces.
</tspan><tspan
         x="99.986328"
         y="549.48633"
         id="tspan31"><tspan
   style="font-weight:bold"
   id="tspan30">Procedure</tspan>: May move police to an adjacent, un-</tspan><tspan
         x="99.986328"
         y="589.48633"
         id="tspan32">sabotaged LOC, then may move to an adjacent space. </tspan><tspan
         x="99.986328"
         y="629.48633"
         id="tspan33">Then, at final destination spaces:
</tspan><tspan
         x="99.986328"
         y="669.48633"
         id="tspan34">* If at an emergency zone, LOC, or strategic center, </tspan><tspan
         x="99.986328"
         y="709.48633"
         id="tspan35">reveal one cell for every cubes there.
</tspan><tspan
         x="99.986328"
         y="749.48633"
         id="tspan36">* Otherwise, reveal one cell for every two cubes there.
</tspan><tspan
         x="99.986328"
         y="789.48633"
         id="tspan39">Then, if destination space has sabotage or terror, and </tspan><tspan
         x="99.986328"
         y="829.48633"
         id="tspan40">is not an LOC or strategic center, place an emergency </tspan><tspan
         x="99.986328"
         y="869.48633"
         id="tspan42">zone and flip any politicians there underground.
</tspan><tspan
         x="99.986328"
         y="909.48633"
         id="tspan44"><tspan
           style="font-style:italic"
           id="tspan43">Note: Movement is considered to be simultaneous.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text29"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:32px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect29);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,264.55405)"><tspan
         x="99.986328"
         y="1060.3945"
         id="tspan46"><tspan
   style="font-weight:bold"
   id="tspan45">Assault</tspan>
</tspan><tspan
         x="99.986328"
         y="1100.3945"
         id="tspan48"><tspan
   style="font-weight:bold"
   id="tspan47">Location</tspan>: Any spaces with police.
</tspan><tspan
         x="99.986328"
         y="1140.3945"
         id="tspan50"><tspan
   style="font-weight:bold"
   id="tspan49">Procedure</tspan>: In each space, determine attack power: </tspan><tspan
         x="99.986328"
         y="1180.3945"
         id="tspan51">roll a die and take the half result, rounded up, and add </tspan><tspan
         x="99.986328"
         y="1220.3945"
         id="tspan52">that to the number of police in the space. Then, must </tspan><tspan
         x="99.986328"
         y="1260.3945"
         id="tspan53">remove that many pieces, if possible.
</tspan><tspan
         x="99.986328"
         y="1300.3945"
         id="tspan54">First, remove active rats, then gang members, then </tspan><tspan
         x="99.986328"
         y="1340.3945"
         id="tspan56">civilians. <tspan
   style="font-style:italic"
   id="tspan55">If the space is an emergency zone</tspan>, may </tspan><tspan
         x="99.986328"
         y="1380.3945"
         id="tspan57">spend one power to flip an underground rat to active. </tspan><tspan
         x="99.986328"
         y="1420.3945"
         id="tspan58">Remove arms caches or the moss grower only once no </tspan><tspan
         x="99.986328"
         y="1460.3945"
         id="tspan60">rats remain. <tspan
   style="font-style:italic"
   id="tspan59">If any civilians are removed</tspan>, add a terror </tspan><tspan
         x="99.986328"
         y="1500.3945"
         id="tspan61">to the space. (Civilians are removed to the </tspan><tspan
         x="99.986328"
         y="1540.3945"
         id="tspan62">government's collateral box)
</tspan><tspan
         x="99.986328"
         y="1580.3945"
         id="tspan64"><tspan
   style="font-style:italic"
   id="tspan63">If an arms cache or the moss grower is removed</tspan>, gain </tspan><tspan
         x="99.986328"
         y="1620.3945"
         id="tspan66">one political will. <tspan
   style="font-style:italic"
   id="tspan65">If the moss grower is removed</tspan>, shift </tspan><tspan
         x="99.986328"
         y="1660.3945"
         id="tspan67">the moss track down once.</tspan></text>
  </g>
</svg>
