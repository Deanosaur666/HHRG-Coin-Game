       ry="75.590553" />
    <text
       xml:space="preserve"
       id="text24"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect24);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-42.000001,821.03221)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan130"><tspan
           style="font-weight:bold"
           id="tspan129">NOTES:
</tspan></tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan133"><tspan
           style="font-size:26.6667px"
           id="tspan131">*</tspan><tspan
           style="font-size:26.6667px"
           id="tspan132">1: When placing emergency zones, flip politicians present </tspan></tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan135"><tspan
           style="font-size:26.6667px"
           id="tspan134">underground.
</tspan></tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan137"><tspan
           style="font-size:26.6667px"
           id="tspan136">*2: When placing an active politician or activating an underground </tspan></tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan139"><tspan
           style="font-size:26.6667px"
           id="tspan138">politician, remove any emergency zone present.
</tspan></tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan141"><tspan
           style="font-size:26.6667px"
           id="tspan140">*3: When removing arms caches or the moss grower, increase political </tspan></tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan143"><tspan
           style="font-size:26.6667px"
           id="tspan142">will by 1. When removing the moss grower, shift the moss track down </tspan></tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan145"><tspan
           style="font-size:26.6667px"
           id="tspan144">one space.
</tspan></tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan147"><tspan
           style="font-size:26.6667px"
           id="tspan146">* 4: Civilians and gangsters removed by government ops or specials are </tspan></tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan149"><tspan
           style="font-size:26.6667px"
           id="tspan148">always placed in the government's collateral box.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text26"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect27);display:inline;vector-effect:non-scaling-stroke;fill:#ffffff;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline" />
  </g>
