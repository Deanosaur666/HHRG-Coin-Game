    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="265.12305"
         y="61.023438"
         id="tspan6"><tspan
           style="font-weight:bold"
           id="tspan5">GOVERNMENT OPS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(-20.485282,-27.698486)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan8"><tspan
   style="font-weight:bold"
   id="tspan7">Mobilize</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan10"><tspan
   style="font-weight:bold"
   id="tspan9">Location:</tspan> 3 districts, LOCs, or Strategic centers.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan12"><tspan
   style="font-weight:bold"
   id="tspan11">Procedure:</tspan>
</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan14"><tspan
   style="font-style:italic"
   id="tspan13">In police stations:</tspan> Place up to 2 police if un-sabotaged, or 1 if </tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan15">sabotaged.
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan41"><tspan
           style="font-style:italic"
           id="tspan16">In LOCs with at least 2 police, or Strategic Centers with at </tspan></tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan44"><tspan
   style="font-style:italic"
   id="tspan42">least 4 police:</tspan> Remove a sabotage.
</tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan60"><tspan
   style="font-style:italic"
   id="tspan50">In districts with police</tspan>, either: 
</tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan62">* Place an active politician (or move an active politician to the </tspan><tspan
         x="101.01562"
         y="492.01523"
         id="tspan63">space if none are available). Then, for each politician in that </tspan><tspan
         x="101.01562"
         y="528.68185"
         id="tspan64">space, may remove a terror or sabotage from the space, or, if </tspan><tspan
         x="101.01562"
         y="565.34848"
         id="tspan66"><tspan
   style="font-style:italic"
   id="tspan65">no terror and no sabotage,</tspan> shift the space towards support. 
</tspan><tspan
         x="101.01562"
         y="602.01511"
         id="tspan67">* If underground politician, flip all politicians to active, (and </tspan><tspan
         x="101.01562"
         y="638.68173"
         id="tspan68">remove any emergency zone in that space).</tspan></text>
    <g
       id="g42"
       style="display:none"
       inkscape:label="Reference">
      <path
         style="display:inline;vector-effect:non-scaling-stroke;fill:none;fill-opacity:1;stroke:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
