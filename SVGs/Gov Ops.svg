    <text
       xml:space="preserve"
       id="text25"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:32px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect26);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"><tspan
         x="99.986328"
         y="469.48633"
         id="tspan38"><tspan
   style="font-weight:bold"
   id="tspan37">Sweep</tspan>
</tspan><tspan
         x="99.986328"
         y="509.48633"
         id="tspan40"><tspan
   style="font-weight:bold"
   id="tspan39">Purpose</tspan>: Move police and reveal Rat cells.
</tspan><tspan
         x="99.986328"
         y="549.48633"
         id="tspan42"><tspan
   style="font-weight:bold"
   id="tspan41">Location</tspan>: Any destination spaces.
</tspan><tspan
         x="99.986328"
         y="589.48633"
         id="tspan47"><tspan
   style="font-weight:bold"
   id="tspan46">Procedure</tspan>: May move police to an adjacent, un-</tspan><tspan
         x="99.986328"
         y="629.48633"
         id="tspan48">sabotaged LOC, then may move to an adjacent space. </tspan><tspan
         x="99.986328"
         y="669.48633"
         id="tspan105">Then, at final destination spaces:
</tspan><tspan
         x="99.986328"
         y="709.48633"
         id="tspan106">* If at an emergency zone, LOC, or strategic center, </tspan><tspan
         x="99.986328"
         y="749.48633"
         id="tspan107">reveal one cell for every cubes there.
</tspan><tspan
         x="99.986328"
         y="789.48633"
         id="tspan108">* Otherwise, reveal one cell for every two cubes there.
</tspan><tspan
         x="99.986328"
         y="829.48633"
         id="tspan109">Then, if destination space has sabotage or terror, and </tspan><tspan
         x="99.986328"
         y="869.48633"
         id="tspan110">is not an LOC or strategic center, place an emergency </tspan><tspan
         x="99.986328"
         y="909.48633"
         id="tspan111">zone.
</tspan><tspan
         x="99.986328"
         y="949.48633"
         id="tspan112">*Note: Movement is considered to be simultaneous.*
</tspan></text>
    <text
       xml:space="preserve"
       id="text29"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:32px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect29);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,18.554045)"><tspan
         x="99.986328"
         y="1060.3945"
         id="tspan114"><tspan
   style="font-weight:bold"
   id="tspan113">Assault</tspan>
</tspan><tspan
         x="99.986328"
         y="1100.3945"
         id="tspan116"><tspan
   style="font-weight:bold"
   id="tspan115">Purpose</tspan>: Remove Rat cells, arm caches, moss </tspan><tspan
         x="99.986328"
         y="1140.3945"
         id="tspan117">growers, and gangs.
</tspan><tspan
         x="99.986328"
         y="1180.3945"
         id="tspan119"><tspan
   style="font-weight:bold"
   id="tspan118">Location</tspan>: Any spaces with police.
</tspan><tspan
         x="99.986328"
         y="1220.3945"
         id="tspan121"><tspan
   style="font-weight:bold"
   id="tspan120">Procedure</tspan>: In each space, determine attack power </tspan><tspan
         x="99.986328"
         y="1260.3945"
         id="tspan122">by rolling a dice and adding the number of police in </tspan><tspan
         x="99.986328"
         y="1300.3945"
         id="tspan123">the space. Then, must remove that many pieces, if </tspan><tspan
         x="99.986328"
         y="1340.3945"
         id="tspan124">possible. First, remove active rats, then gang </tspan><tspan
         x="99.986328"
         y="1380.3945"
         id="tspan126">members, then civilians. <tspan
   style="font-style:italic"
   id="tspan125">If the space is an emergency </tspan></tspan><tspan
         x="99.986328"
         y="1420.3945"
         id="tspan128"><tspan
   style="font-style:italic"
   id="tspan127">zone</tspan>, may spend one power to flip an underground rat </tspan><tspan
         x="99.986328"
         y="1460.3945"
         id="tspan129">to active. Remove arms caches or the moss grower </tspan><tspan
         x="99.986328"
         y="1500.3945"
         id="tspan130">only once no rats remain. If any civilians are removed, </tspan><tspan
         x="99.986328"
         y="1540.3945"
         id="tspan131">add a terror to the space, and shift the support track </tspan><tspan
         x="99.986328"
         y="1580.3945"
         id="tspan133">to the left for each removed. <tspan
   style="font-style:italic"
   id="tspan132">If an arms cache or the </tspan></tspan><tspan
         x="99.986328"
         y="1620.3945"
         id="tspan136"><tspan
   style="font-style:italic"
   id="tspan134">moss grower is </tspan><tspan
   style="font-style:italic"
   id="tspan135">removed</tspan>, the Government player gets </tspan><tspan
         x="99.986328"
         y="1660.3945"
         id="tspan139">1 point. <tspan
   style="font-style:italic"
   id="tspan137">If the </tspan><tspan
   style="font-style:italic"
   id="tspan138">moss grower is removed</tspan>, shift the moss </tspan><tspan
         x="99.986328"
         y="1700.3945"
         id="tspan140">track once to the left.</tspan></text>
    <text
       xml:space="preserve"
       id="text36"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:32px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect36);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(0,96.893345)"><tspan
         x="99.986328"
         y="1764.4844"
         id="tspan142"><tspan
   style="font-weight:bold"
   id="tspan141">Pacify</tspan>
</tspan><tspan
         x="99.986328"
         y="1804.4844"
         id="tspan144"><tspan
   style="font-weight:bold"
   id="tspan143">Purpose</tspan>: Place politicians, increase civilian </tspan><tspan
         x="99.986328"
         y="1844.4844"
         id="tspan145">population, and remove terror.
</tspan><tspan
         x="99.986328"
         y="1884.4844"
         id="tspan147"><tspan
   style="font-weight:bold"
   id="tspan146">Location</tspan>: Up to two districts with police or politicians.
</tspan><tspan
         x="99.986328"
         y="1924.4844"
         id="tspan149"><tspan
   style="font-weight:bold"
   id="tspan148">Procedure</tspan>: In each space:
</tspan><tspan
         x="99.986328"
         y="1964.4844"
         id="tspan151"><tspan
   style="font-style:italic"
   id="tspan150">* If police</tspan>, place an active politician or move an active </tspan><tspan
         x="99.986328"
         y="2004.4844"
         id="tspan152">politician to the space if none are available. Then, </tspan><tspan
         x="99.986328"
         y="2044.4844"
         id="tspan153">may remove a terror or gangster from the space, and </tspan><tspan
         x="99.986328"
         y="2084.4844"
         id="tspan154">add a civilian to the space.
</tspan><tspan
         x="99.986328"
         y="2124.4844"
         id="tspan156">* <tspan
   style="font-style:italic"
   id="tspan155">If underground politician</tspan>, flip the politician to active.</tspan></text>
  </g>
</svg>
