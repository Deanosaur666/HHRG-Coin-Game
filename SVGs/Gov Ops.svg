           style="font-weight:bold"
           id="tspan26">GOVERNMENT OPS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:32px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="164.375"
         id="tspan29"><tspan
   style="font-weight:bold"
   id="tspan28">Train</tspan>
</tspan><tspan
         x="101.01562"
         y="204.375"
         id="tspan31"><tspan
   style="font-weight:bold"
   id="tspan30">Purpose</tspan>: Place police.
</tspan><tspan
         x="101.01562"
         y="244.375"
         id="tspan33"><tspan
   style="font-weight:bold"
   id="tspan32">Location</tspan>: Any police stations.
</tspan><tspan
         x="101.01562"
         y="284.375"
         id="tspan35"><tspan
   style="font-weight:bold"
   id="tspan34">Procedure</tspan>: Place up to 2 police in each un-sabotaged </tspan><tspan
         x="101.01562"
         y="324.375"
         id="tspan36">space and 1 police in each sabotaged space.</tspan></text>
    <g
       id="g42"
