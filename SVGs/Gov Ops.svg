    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="265.12305"
         y="61.023438"
         id="tspan4"><tspan
           style="font-weight:bold"
           id="tspan3">GOVERNMENT OPS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"
       transform="translate(-20.485282,-27.698486)"><tspan
         x="101.01562"
         y="162.0156"
         id="tspan9"><tspan
   style="font-weight:bold"
   id="tspan8">Mobilize</tspan>
</tspan><tspan
         x="101.01562"
         y="198.68222"
         id="tspan19"><tspan
   style="font-weight:bold"
   id="tspan17">Location</tspan>: 3 spaces, either districts or police stations.
</tspan><tspan
         x="101.01562"
         y="235.34885"
         id="tspan22"><tspan
   style="font-weight:bold"
   id="tspan20">Procedure</tspan>: <tspan
   style="font-style:italic"
   id="tspan21">In police stations</tspan>: Place up to 2 police if un-</tspan><tspan
         x="101.01562"
         y="272.01547"
         id="tspan23">sabotaged, or 1 if sabotaged.
</tspan><tspan
         x="101.01562"
         y="308.6821"
         id="tspan33"><tspan
   style="font-style:italic"
   id="tspan25">In districts, either without opposition, or with police:</tspan> 
</tspan><tspan
         x="101.01562"
         y="345.34873"
         id="tspan34">* Place an active politician or move an active politician to the </tspan><tspan
         x="101.01562"
         y="382.01535"
         id="tspan35">space if none are available (*2). Then, may remove a terror or </tspan><tspan
         x="101.01562"
         y="418.68198"
         id="tspan37">sabotage from the space, or, <tspan
   style="font-style:italic"
   id="tspan36">if no terror and no sabotage,</tspan> </tspan><tspan
         x="101.01562"
         y="455.3486"
         id="tspan38">may shift the space towards support. 
</tspan><tspan
         x="101.01562"
         y="492.01523"
         id="tspan39">* If underground politician and police, flip the politician to </tspan><tspan
         x="101.01562"
         y="528.68185"
         id="tspan40">active. (*2)</tspan></text>
    <g
       id="g42"
       style="display:none"
       inkscape:label="Reference">
      <path
         style="display:inline;vector-effect:non-scaling-stroke;fill:none;fill-opacity:1;stroke:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
