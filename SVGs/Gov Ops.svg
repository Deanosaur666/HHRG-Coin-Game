    <text
       xml:space="preserve"
       id="text22"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect22);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"><tspan
         x="265.12305"
         y="61.023438"
         id="tspan9"><tspan
           style="font-weight:bold"
           id="tspan8">GOVERNMENT OPS</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text23"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:32px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect23);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-290.68002"
       y="0"><tspan
         x="101.01562"
         y="164.375"
         id="tspan11"><tspan
   style="font-weight:bold"
   id="tspan10">Mobilize</tspan>
</tspan><tspan
         x="101.01562"
         y="204.375"
         id="tspan13"><tspan
   style="font-weight:bold"
   id="tspan12">Location</tspan>: 3 spaces, either districts or police stations.
</tspan><tspan
         x="101.01562"
         y="244.375"
         id="tspan16"><tspan
   style="font-weight:bold"
   id="tspan14">Procedure</tspan>: <tspan
   style="font-style:italic"
   id="tspan15">In police stations</tspan>: Place up to 2 police if un-</tspan><tspan
         x="101.01562"
         y="284.375"
         id="tspan17">sabotaged, or 1 if sabotaged.
</tspan><tspan
         x="101.01562"
         y="324.375"
         id="tspan18">In districts: 
</tspan><tspan
         x="101.01562"
         y="364.375"
         id="tspan19">* If police present, place an active politician or move an </tspan><tspan
         x="101.01562"
         y="404.375"
         id="tspan20">active politician to the space if none are available. Then, </tspan><tspan
         x="101.01562"
         y="444.375"
         id="tspan21">may remove a terror or from the space, or replace a </tspan><tspan
         x="101.01562"
         y="484.375"
         id="tspan22">gangster with a civilian. Remove any emergency zone in </tspan><tspan
         x="101.01562"
         y="524.375"
         id="tspan23">that space.
</tspan><tspan
         x="101.01562"
         y="564.375"
         id="tspan24">* If underground politician, flip the politician to active, </tspan><tspan
         x="101.01562"
         y="604.375"
         id="tspan25">and remove any emergency zone in that space.</tspan></text>
    <g
       id="g42"
       style="display:none"
       inkscape:label="Reference">
      <path
         style="display:inline;vector-effect:non-scaling-stroke;fill:none;fill-opacity:1;stroke:#000000;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
