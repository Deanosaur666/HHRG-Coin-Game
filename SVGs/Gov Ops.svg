    <text
       xml:space="preserve"
       id="text25"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect26);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-20.485282,141.46595)"><tspan
         x="99.986328"
         y="467.12692"
         id="tspan42"><tspan
   style="font-weight:bold"
   id="tspan41">Sweep</tspan>
</tspan><tspan
         x="99.986328"
         y="503.79355"
         id="tspan48"><tspan
   style="font-weight:bold"
   id="tspan44">Location</tspan>: Any destination spaces.
</tspan><tspan
         x="99.986328"
         y="540.46018"
         id="tspan51"><tspan
   style="font-weight:bold"
   id="tspan50">Procedure</tspan>: May move police to an adjacent, un-sabotaged </tspan><tspan
         x="99.986328"
         y="577.1268"
         id="tspan52">LOC, then may move to an adjacent space. Then, at final </tspan><tspan
         x="99.986328"
         y="613.79343"
         id="tspan53">destination spaces:
</tspan><tspan
         x="99.986328"
         y="650.46005"
         id="tspan54">* If the space is at opposition, reveal one cell for every two </tspan><tspan
         x="99.986328"
         y="687.12668"
         id="tspan55">police there.
</tspan><tspan
         x="99.986328"
         y="723.79331"
         id="tspan56">* Otherwise, reveal one cell for every police there.
</tspan><tspan
         x="99.986328"
         y="760.45993"
         id="tspan57">* In one selected sweep space, may free assault instead of </tspan><tspan
         x="99.986328"
         y="797.12656"
         id="tspan58">revealing.
</tspan><tspan
         x="99.986328"
         y="833.79318"
         id="tspan59">If destination has sabotage or terror, and is not an LOC or </tspan><tspan
         x="99.986328"
         y="870.45981"
         id="tspan60">strategic center, place an emergency zone (*1)
</tspan><tspan
         x="99.986328"
         y="907.12644"
         id="tspan62"><tspan
           style="font-style:italic"
           id="tspan61">Note: Movement is considered to be simultaneous.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text29"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect29);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-22.485282,89.600734)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan64"><tspan
   style="font-weight:bold"
   id="tspan63">Assault</tspan>
</tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan66"><tspan
   style="font-weight:bold"
   id="tspan65">Location</tspan>: Any spaces with police.
</tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan68"><tspan
   style="font-weight:bold"
   id="tspan67">Procedure</tspan>: In each space, determine attack power: roll a </tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan69">dice, and add that to the number of police in the space. Then, </tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan70">must remove that many pieces, if possible.
</tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan71">First, remove active rats, then gang members, then civilians. </tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan72">If the space is an emergency zone, may spend one power to </tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan73">flip an underground rat to active. Remove arms caches or the </tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan74">moss grower only once no rats remain. (*3) If any civilians </tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan75">are removed, add a terror to the space. (Civilians are </tspan><tspan
         x="99.986328"
         y="1424.7014"
         id="tspan76">removed to the government's collateral box)
</tspan></text>
    <rect
       style="vector-effect:non-scaling-stroke;fill:#d3f3f3;fill-opacity:1;stroke:#000000;stroke-width:0.999991;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       id="rect4"
       width="1006.8467"
       height="432.52551"
       x="36.576656"
       y="1564.9613"
       rx="81.872604"
       ry="72.249725" />
    <text
       xml:space="preserve"
       id="text7"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect7);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-26.000001,564.28703)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan78"><tspan
   style="font-weight:bold"
   id="tspan77">Artillery</tspan>
</tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan80"><tspan
   style="font-style:italic"
   id="tspan79">Only available if artillery strategic center is not sabotaged.</tspan>
</tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan82"><tspan
   style="font-weight:bold"
   id="tspan81">Location</tspan>: Any one district or foreign space
</tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan84"><tspan
   style="font-weight:bold"
   id="tspan83">Procedure</tspan>: As a cost, remove 3 police from police stations and/</tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan85">or available to out of play. Then remove all pieces (*3) except </tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan87">sabotage from the space (police and politicians to <tspan
   style="font-style:italic"
   id="tspan86">available</tspan>, </tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan88">civilians to government collateral), and set the space to neutral.
</tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan89">If the target space is a foreign space, shift the moss down once </tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan90">and lose one political will.
</tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan91">If the target space is at support, lose one political will.</tspan></text>
    <rect
       style="vector-effect:non-scaling-stroke;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       id="rect18"
       width="1029.5918"
       height="307.31219"
       x="21.204069"
       y="2006.0498"
       rx="75.590553"
       ry="75.590553" />
    <text
       xml:space="preserve"
       id="text24"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect24);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-42.000001,995.3754)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan93"><tspan
           style="font-weight:bold"
           id="tspan92">NOTES:
</tspan></tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan96"><tspan
           style="font-size:26.6667px"
           id="tspan94">*</tspan><tspan
           style="font-size:26.6667px"
           id="tspan95">1: When placing emergency zones, flip politicians present underground.
</tspan></tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan98"><tspan
           style="font-size:26.6667px"
           id="tspan97">*2: When placing an active politician or activating an underground </tspan></tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan100"><tspan
           style="font-size:26.6667px"
           id="tspan99">politician, remove any emergency zone present.
</tspan></tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan102"><tspan
           style="font-size:26.6667px"
           id="tspan101">*3: When removing arms caches or the moss grower, increase political </tspan></tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan104"><tspan
           style="font-size:26.6667px"
           id="tspan103">will by 1. When removing the moss grower, shift the moss track down </tspan></tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan106"><tspan
           style="font-size:26.6667px"
           id="tspan105">one space.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text26"
       style="font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect27);display:inline;vector-effect:non-scaling-stroke;fill:#ffffff;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline" />
  </g>
