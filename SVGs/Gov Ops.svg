    <text
       xml:space="preserve"
       id="text25"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect26);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-20.485282,274.80404)"><tspan
         x="99.986328"
         y="467.12692"
         id="tspan71"><tspan
   style="font-weight:bold"
   id="tspan70">Sweep</tspan>
</tspan><tspan
         x="99.986328"
         y="503.79355"
         id="tspan73"><tspan
   style="font-weight:bold"
   id="tspan72">Location</tspan>: Any 3 destination spaces.
</tspan><tspan
         x="99.986328"
         y="540.46018"
         id="tspan75"><tspan
   style="font-weight:bold"
   id="tspan74">Procedure</tspan>: Move police from adjacent spaces, then:
</tspan><tspan
         x="99.986328"
         y="577.1268"
         id="tspan76">* If the space is at opposition, reveal one cell for every two </tspan><tspan
         x="99.986328"
         y="613.79343"
         id="tspan78">police there.
</tspan><tspan
         x="99.986328"
         y="650.46005"
         id="tspan79">* Otherwise, reveal one cell for every police there.
</tspan><tspan
         x="99.986328"
         y="687.12668"
         id="tspan80">* When sweeping into emergency zones, may assault there </tspan><tspan
         x="99.986328"
         y="723.79331"
         id="tspan81">instead of revealing.
</tspan><tspan
         x="99.986328"
         y="760.45993"
         id="tspan83">If destination has sabotage or terror, and is not an LOC or </tspan><tspan
         x="99.986328"
         y="797.12656"
         id="tspan92">strategic center, place an emergency zone (*1)
</tspan><tspan
         x="99.986328"
         y="833.79318"
         id="tspan93">If the destination has terror, roll for a shootout.
</tspan><tspan
         x="99.986328"
         y="870.45981"
         id="tspan95"><tspan
           style="font-style:italic"
           id="tspan94">Note: Movement is considered to be simultaneous.</tspan></tspan></text>
    <text
       xml:space="preserve"
       id="text29"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:29.3333px;font-family:'DejaVu Sans';-inkscape-font-specification:'DejaVu Sans';text-align:start;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect29);display:inline;vector-effect:non-scaling-stroke;fill:#000000;fill-opacity:1;stroke:none;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
       x="-440.01428"
       y="0"
       transform="translate(-22.485282,222.93882)"><tspan
         x="99.986328"
         y="1058.0351"
         id="tspan97"><tspan
   style="font-weight:bold"
   id="tspan96">Assault</tspan>
</tspan><tspan
         x="99.986328"
         y="1094.7018"
         id="tspan99"><tspan
   style="font-weight:bold"
   id="tspan98">Location</tspan>: Any 3 spaces with police.
</tspan><tspan
         x="99.986328"
         y="1131.3684"
         id="tspan101"><tspan
   style="font-weight:bold"
   id="tspan100">Procedure</tspan>: In each space, determine attack power: roll a </tspan><tspan
         x="99.986328"
         y="1168.035"
         id="tspan102">dice, and add that to the number of police in the space. Then, </tspan><tspan
         x="99.986328"
         y="1204.7016"
         id="tspan103">must spend as much power as possible to remove pieces.
</tspan><tspan
         x="99.986328"
         y="1241.3683"
         id="tspan105"> * First, remove active rats for 1 power each. <tspan
   style="font-style:italic"
   id="tspan104">If the space is </tspan></tspan><tspan
         x="99.986328"
         y="1278.0349"
         id="tspan120"><tspan
   style="font-style:italic"
   id="tspan106">an emergency zone</tspan>, may spent one power to flip an </tspan><tspan
         x="99.986328"
         y="1314.7015"
         id="tspan121">underground rat active.
</tspan><tspan
         x="99.986328"
         y="1351.3681"
         id="tspan122"> * Remove arms caches or the moss grower once no rats </tspan><tspan
         x="99.986328"
         y="1388.0348"
         id="tspan123">remain, for 1 power each.
</tspan><tspan
         x="99.986328"
         y="1424.7014"
         id="tspan124"> * If power remaining is 3 or greater: remove a gangster, or if  </tspan><tspan
         x="99.986328"
         y="1461.368"
         id="tspan125">none, remove a civilian. 
</tspan><tspan
         x="99.986328"
         y="1498.0346"
         id="tspan128"><tspan
   style="font-style:italic"
   id="tspan126">If any civilians are removed</tspan>, add a terror to the space. <tspan
   style="font-style:italic"
   id="tspan127">
</tspan></tspan></text>
    <rect
       style="vector-effect:non-scaling-stroke;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.999996;stroke-linecap:square;stroke-linejoin:bevel;-inkscape-stroke:hairline"
